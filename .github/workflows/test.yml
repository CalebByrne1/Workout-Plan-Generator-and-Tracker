# Runs both test suites on every push and pull request.
#
# No install step: the project has no dependencies. The browser suite uses
# the Chrome that ships on GitHub's Ubuntu runners.

name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Logic tests
        run: node test/logic.mjs

      - name: Sync tests
        run: node test/sync.mjs

      - name: Browser tests
        run: node test/browser.mjs
