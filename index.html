<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171C1D" media="(prefers-color-scheme: dark)">
<meta name="description" content="A four-day upper/lower workout tracker that remembers your loads, sets and notes on the device.">

<title>Iron Ledger</title>

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Ledger">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="tb-row">
      <div class="brand">
        <h1>Iron Ledger</h1>
        <span class="cycle" id="cycleLabel">Cycle 1</span>
      </div>
      <div class="tb-actions">
        <button class="tb-btn" id="tabTrain" aria-pressed="true">Train</button>
        <button class="tb-btn" id="tabLog" aria-pressed="false">Log</button>
      </div>
    </div>
    <nav class="rail" id="rail" aria-label="Four day rotation"></nav>
  </header>

  <main id="view"></main>

  <footer class="actionbar" id="actionbar">
    <button class="timer" id="timer" data-run="0">
      <span class="t" id="timerT">3:00</span>
      <span class="l" id="timerL">Rest</span>
    </button>
    <button class="finish" id="finish">Finish session</button>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h3 id="sheetTitle">Edit</h3>
    <button class="edit" id="sheetClose">Done</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--
  Plain <script> tags, not ES modules, so the app also runs when you just
  double-click this file. Modules would need a web server to load.
  Order matters: each file hangs itself off the shared window.IL namespace.
-->
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
