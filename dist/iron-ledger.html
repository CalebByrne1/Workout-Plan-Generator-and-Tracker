<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171C1D" media="(prefers-color-scheme: dark)">
<meta name="description" content="A four-day upper/lower workout tracker that remembers your loads, sets and notes on the device.">

<title>Iron Ledger</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   Iron Ledger — industrial amber on cool graphite.
   Every colour is a token declared on :root first, then re-declared for the
   two dark cases, so nothing is left undefined in any theme state.
   ========================================================================== */

:root{
  /* surfaces */
  --ground:#EDEFEE;
  --surface:#FFFFFF;
  --surface-2:#E4E8E7;
  /* text */
  --ink:#14191A;
  --ink-2:#4C5759;
  --ink-3:#7C8A8B;
  /* rules */
  --line:#C9D1D0;
  --line-soft:#DCE1E0;
  /* accent — rack-pin amber */
  --accent:#A85F00;
  --accent-hi:#C87400;
  --accent-ink:#FFFFFF;
  --accent-soft:#F3E1C4;
  /* semantic, kept separate from the accent */
  --good:#1C7359;
  --danger:#A03A18;

  --shadow:0 1px 2px rgba(16,26,26,.10), 0 12px 28px -12px rgba(16,26,26,.28);
  --r:10px;

  --font-d:"Saira Condensed","Arial Narrow",Haettenschweiler,sans-serif;
  --font-b:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* System dark, unless the viewer explicitly asked for light. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1313;
    --surface:#171C1D;
    --surface-2:#212829;
    --ink:#E8EDEB;
    --ink-2:#A2AFAD;
    --ink-3:#6E7C7C;
    --line:#2B3334;
    --line-soft:#222A2B;
    --accent:#F0A73C;
    --accent-hi:#FFBB57;
    --accent-ink:#1A1205;
    --accent-soft:#382812;
    --good:#4FC3A1;
    --danger:#E1795A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 32px -14px rgba(0,0,0,.7);
  }
}

/* Explicit dark choice wins over a light OS. */
:root[data-theme="dark"]{
  --ground:#0F1313;
  --surface:#171C1D;
  --surface-2:#212829;
  --ink:#E8EDEB;
  --ink-2:#A2AFAD;
  --ink-3:#6E7C7C;
  --line:#2B3334;
  --line-soft:#222A2B;
  --accent:#F0A73C;
  --accent-hi:#FFBB57;
  --accent-ink:#1A1205;
  --accent-soft:#382812;
  --good:#4FC3A1;
  --danger:#E1795A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 32px -14px rgba(0,0,0,.7);
}


/* ==========================================================================
   Base
   ========================================================================== */

*{box-sizing:border-box}

/* Locked in for a phone.

   touch-action:manipulation is the line that stops a double tap zooming: it
   tells the browser this document has no double-tap gesture, so the second
   tap of a quick +5 +5 is another +5 and the 300ms wait-and-see disappears
   with it. Pinch-zoom is deliberately NOT disabled — it is the only way back
   for anyone who needs the text bigger, and nobody pinches by accident. */
html{
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

/* An author `display` beats the browser's own [hidden] rule, so anything
   given a display here — .actionbar, .sheet — would ignore `el.hidden`
   without this. It's the one !important in the file and it earns it. */
[hidden]{display:none !important}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-b);
  font-size:15px;
  line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}

button,input,textarea,select{font:inherit;color:inherit}

/* A fast second tap on a button used to start selecting its label and put
   the magnifier up. Buttons are for pressing; nothing in one needs copying. */
button{
  background:none;border:0;padding:0;cursor:pointer;color:inherit;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
img{max-width:100%}
h1,h2,h3{margin:0;font-family:var(--font-d);font-weight:600;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:4px}

/* Small uppercase caption, used above every form field. */
.lab{
  display:block;margin-bottom:6px;
  font-family:var(--font-m);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);
}

textarea,
input[type="text"],
input[type="number"]{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:11px 12px;
  color:var(--ink);
  /* Never below 16px. Safari zooms the page to meet any field smaller than
     that when it takes focus, and then leaves you scrolled sideways. */
  font-size:16px;
}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input[type="number"]{font-family:var(--font-m);font-variant-numeric:tabular-nums;text-align:center}

.app{
  max-width:560px;margin:0 auto;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  background:var(--ground);
}


/* ==========================================================================
   Top bar + rotation rail
   ========================================================================== */

.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:10px 14px 0;
  padding-top:max(10px,env(safe-area-inset-top));
}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{font-size:21px;letter-spacing:.055em;text-transform:uppercase;line-height:1}
.brand .cycle{
  font-family:var(--font-m);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}

.tb-actions{display:flex;gap:6px;flex:none}
.tb-btn{
  min-height:34px;padding:7px 11px;
  border:1px solid var(--line);border-radius:var(--r);
  font-family:var(--font-d);font-size:13px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
}
.tb-btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* The split itself is the navigation. Amber = where you are,
   teal = the day you logged most recently. */
.rail{display:grid;grid-template-columns:repeat(4,1fr);margin-top:9px}
.rail button{
  padding:9px 2px 10px;text-align:center;
  border-top:3px solid var(--line-soft);
  font-family:var(--font-d);font-size:13px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;line-height:1.15;
  color:var(--ink-3);
}
.rail button .n{
  display:block;margin-bottom:1px;
  font-family:var(--font-m);font-size:9.5px;font-weight:500;
  letter-spacing:.1em;opacity:.75;
}
.rail button[data-logged="1"]{color:var(--ink-2);border-top-color:var(--good)}
.rail button[aria-current="true"]{color:var(--ink);border-top-color:var(--accent)}


/* ==========================================================================
   Session header
   ========================================================================== */

main{flex:1;padding-bottom:8px}

.session-head{
  padding:16px 14px 12px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.session-head h2{font-size:29px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.session-head .sub{margin-top:5px;font-size:12.5px;color:var(--ink-2)}

.prog{flex:none;text-align:right}
.prog .big{
  font-family:var(--font-m);font-size:21px;font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums;
}
.prog .cap{
  margin-top:3px;
  font-family:var(--font-m);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);
}


/* ==========================================================================
   Exercise ledger — hairline rows, not a deck of cards
   ========================================================================== */

.ledger{border-top:1px solid var(--line);background:var(--surface)}

.ex{display:flex;border-bottom:1px solid var(--line-soft)}

/* Left stripe fills as sets are logged, then flips to the completion colour. */
.ex-stripe{flex:none;width:4px;background:var(--line-soft);position:relative}
.ex-stripe i{
  position:absolute;left:0;top:0;display:block;
  width:100%;height:var(--p,0%);
  background:var(--accent);transition:height .18s ease;
}
.ex[data-complete="1"] .ex-stripe i{background:var(--good)}

.ex-body{flex:1;min-width:0;padding:13px 14px 14px}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-head h3{flex:1;min-width:0;font-size:18.5px;letter-spacing:.015em;line-height:1.12}
.ex[data-complete="1"] .ex-head h3{color:var(--ink-2)}

.edit{
  flex:none;min-height:30px;padding:5px 8px;
  border:1px solid var(--line);border-radius:7px;
  font-family:var(--font-m);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}

.ex-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:7px}
.chip{
  padding:3px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);
  font-family:var(--font-m);font-size:11.5px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.chip.load{background:var(--accent-soft);color:var(--accent);font-weight:600}
.last{
  font-family:var(--font-m);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.ex-note{
  margin-top:8px;padding-left:9px;
  border-left:2px solid var(--line);
  font-size:12.5px;color:var(--ink-2);
}

.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin-top:11px}
.set{
  height:46px;
  border:1px solid var(--line);border-radius:8px;background:var(--ground);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--font-m);font-variant-numeric:tabular-nums;
  transition:background .12s,border-color .12s,transform .08s;
}
.set .s{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.set .r{font-size:14px;font-weight:600;color:var(--ink-2)}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.set[aria-pressed="true"] .s,
.set[aria-pressed="true"] .r{color:var(--accent-ink)}
.set:active{transform:scale(.97)}

.addrow{padding:14px}
.add-btn{
  width:100%;min-height:46px;
  border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2);
  font-family:var(--font-d);font-size:15px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
}

.notes{padding:4px 14px 18px}


/* ==========================================================================
   Sticky action bar
   ========================================================================== */

.actionbar{
  position:sticky;bottom:0;z-index:30;
  display:flex;align-items:stretch;gap:9px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
}

.timer{
  flex:none;min-width:92px;padding:0 10px;
  border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.timer .t{
  font-family:var(--font-m);font-size:19px;font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums;
}
.timer .l{
  font-family:var(--font-m);font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.timer[data-run="1"]{border-color:var(--accent);background:var(--accent-soft)}
.timer[data-run="1"] .t{color:var(--accent)}

.finish{
  flex:1;min-height:52px;padding:0 8px;
  border-radius:var(--r);background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-d);font-size:18px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;
}
.finish:active{background:var(--accent-hi)}
.finish[data-armed="1"]{background:var(--good);color:var(--ground);font-size:15px}


/* ==========================================================================
   Bottom sheet
   ========================================================================== */

.scrim{
  position:fixed;inset:0;z-index:40;
  background:rgba(8,14,14,.55);
  opacity:0;transition:opacity .2s;
}
.scrim.open{opacity:1}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:560px;margin:0 auto;max-height:88dvh;
  display:flex;flex-direction:column;
  background:var(--surface);
  border-top-left-radius:16px;border-top-right-radius:16px;
  box-shadow:var(--shadow);
  transform:translateY(100%);
  transition:transform .24s cubic-bezier(.2,.8,.3,1);
}
.sheet.open{transform:translateY(0)}

.sheet-head{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 16px 12px;border-bottom:1px solid var(--line);
}
.sheet-head::before{                      /* grab handle */
  content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:36px;height:4px;border-radius:2px;background:var(--line);
}
.sheet-head h3{flex:1;min-width:0;font-size:19px;letter-spacing:.05em;text-transform:uppercase}

.sheet-body{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:16px;
  padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));
}

.field{display:flex;flex-direction:column}

.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{
  flex:none;width:52px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--ground);
  font-family:var(--font-m);font-size:19px;font-weight:500;color:var(--ink-2);
}
.stepper button:active{background:var(--surface-2)}
.stepper input{flex:1;min-width:0;padding:12px 6px;font-size:19px;font-weight:600}

.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{
  flex:1;min-width:60px;min-height:38px;
  border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-m);font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}

.rowbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rowbtns button{
  min-height:46px;
  border:1px solid var(--line);border-radius:var(--r);color:var(--ink-2);
  font-family:var(--font-d);font-size:14px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;
}
.rowbtns button.danger{color:var(--danger);border-color:var(--danger)}

.swapname{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:12px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);
}
.swapname strong{font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.02em}
.swapname span{
  flex:none;font-family:var(--font-m);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}


/* ==========================================================================
   Exercise library picker
   ========================================================================== */

.lib-group{
  margin:14px 0 6px;padding-top:12px;
  border-top:1px solid var(--line-soft);
  font-family:var(--font-m);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.lib-group:first-of-type{margin-top:0;padding-top:0;border-top:0}

/* A row is the pick button plus, for your own exercises, a way into the
   editor. Two buttons rather than one, because a button inside a button is
   not a thing. */
.lib-row{display:flex;align-items:stretch;gap:8px;border-bottom:1px solid var(--line-soft)}
.lib-row:last-child{border-bottom:0}

.lib-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex:1;min-width:0;min-height:48px;padding:12px 2px;text-align:left;
}
.lib-row .lib-item{border-bottom:0}
.lib-item strong{min-width:0;overflow-wrap:anywhere}

.lib-item.solo{
  border:1px dashed var(--accent);border-radius:var(--r);
  margin-bottom:10px;padding:12px;
}
.lib-item.solo .d{color:var(--accent)}

.lib-edit{
  flex:none;align-self:center;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-m);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.lib-item strong{font-family:var(--font-d);font-size:17px;font-weight:500;letter-spacing:.01em;line-height:1.15}
.lib-item .d{
  flex:none;font-family:var(--font-m);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}


/* ==========================================================================
   Training log
   ========================================================================== */

.hist{display:flex;flex-direction:column;gap:12px;padding:16px 14px 20px}
.empty{padding:36px 20px;text-align:center;font-size:14px;color:var(--ink-3)}

.sess{
  background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r);
  overflow:hidden;
}
.sess-top{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;text-align:left}
.sess-tag{
  flex:none;padding:4px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);
  font-family:var(--font-d);font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
}
.sess-when{flex:1;min-width:0}
.sess-when b{
  display:block;text-transform:uppercase;
  font-family:var(--font-d);font-size:16px;font-weight:600;letter-spacing:.03em;
}
.sess-when small{
  font-family:var(--font-m);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.sess-vol{flex:none;text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.sess-vol b{display:block;font-size:15px;font-weight:600;line-height:1.1}
.sess-vol small{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}

.sess-detail{border-top:1px solid var(--line-soft);padding:4px 13px 12px}
.sess-line{
  display:flex;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;
}
.sess-line:last-of-type{border-bottom:0}
.sess-line span{
  flex:none;font-family:var(--font-m);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.sess-note{
  margin-top:10px;padding-left:9px;
  border-left:2px solid var(--accent);
  font-size:13px;color:var(--ink-2);
}
.sess-del{
  margin-top:12px;min-height:32px;
  font-family:var(--font-m);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--danger);
}


/* ==========================================================================
   Settings
   ========================================================================== */

.settings{
  margin-top:8px;padding-top:16px;
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:12px;
}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.setrow .k{font-size:14px}
.setrow .k small{display:block;font-size:11.5px;color:var(--ink-3)}
.setrow .edit.danger{color:var(--danger);border-color:var(--danger)}

.seg{flex:none;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{
  min-height:38px;padding:8px 12px;
  font-family:var(--font-m);font-size:12px;color:var(--ink-3);
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}


/* ==========================================================================
   Toast
   ========================================================================== */

.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,20px);
  max-width:calc(100% - 28px);padding:11px 16px;
  background:var(--ink);color:var(--ground);
  border-radius:var(--r);box-shadow:var(--shadow);
  font-size:13.5px;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}


@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}


/* ==========================================================================
   Set logger — one set, one or more weights
   ========================================================================== */

.sheet-sub{
  margin-top:-4px;
  font-family:var(--font-m);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);
}

.hint{margin-top:8px;font-size:12px;color:var(--ink-3);line-height:1.4}

/* Each weight in the set gets its own block. The top set is plain; drops
   are indented behind an amber rail so the hierarchy is visible at a glance. */
.segblock{
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
}
.segblock.is-drop{
  border-left:3px solid var(--accent);
  background:var(--ground);
}

.segblock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px}
.seglabel{
  font-family:var(--font-m);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.segdel{
  font-family:var(--font-m);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--danger);min-height:28px;padding:0 4px;
}

.seggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seggrid .lab{margin-bottom:5px}

/* Narrower stepper for the two-up grid. */
.stepper.mini button{width:40px;font-size:17px}
.stepper.mini input{padding:10px 2px;font-size:17px}

/* Rep chips derived from the exercise's own target. */
.quick.reps{margin-top:0}
.quick.reps button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
}

.settotal{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:12px 13px;border-radius:var(--r);
  background:var(--surface-2);
}
.settotal span{
  font-family:var(--font-m);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);
}
.settotal b{
  font-family:var(--font-m);font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;
}

.rowbtns.one{grid-template-columns:1fr}

/* Drop sets spelled out inside a logged session. */
.sess-drops{
  padding:0 0 8px 0;
  font-family:var(--font-m);font-size:11.5px;line-height:1.6;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}


/* ==========================================================================
   Three tabs on a phone

   Train / Log / Progress plus the wordmark won't fit across 360px, so the
   cycle badge steps aside there — the day's subtitle carries it instead.
   ========================================================================== */

@media (max-width:430px){
  .brand h1{font-size:18px}
  .brand .cycle{display:none}
  .tb-btn{padding:7px 8px;font-size:12px;letter-spacing:.055em}
}


/* ==========================================================================
   Dates and selects — same furniture as the text fields
   ========================================================================== */

input[type="date"],
select{
  width:100%;min-height:46px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:11px 12px;
  color:var(--ink);
  font-size:16px;      /* as above: under 16 and focusing it zooms iOS */
}
input[type="date"]{
  -webkit-appearance:none;appearance:none;
  font-family:var(--font-m);font-variant-numeric:tabular-nums;
}

.seg.wide{width:100%}
.seg.wide button{flex:1}

.rowbtns button.primary{
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
}


/* ==========================================================================
   Days off in the log
   ========================================================================== */

.sess.is-skip .sess-when b{color:var(--ink-2)}
.sess.is-skip .sess-vol b{font-family:var(--font-d);font-size:14px;color:var(--ink-3)}
.sess.is-skip .sess-tag{background:var(--surface-2);color:var(--ink-3)}
.sess[data-skip="missed"] .sess-tag{
  background:transparent;color:var(--danger);
  box-shadow:inset 0 0 0 1px var(--danger);
}

.sess-date{padding:10px 0 12px}
.sess-date .lab{margin-bottom:5px}


/* ==========================================================================
   Getting the data out
   ========================================================================== */

.set-title{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.datarow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.datarow .add-btn{font-size:13.5px}
.settings .hint{margin-top:0}


/* ==========================================================================
   Progress
   ========================================================================== */

.prog-wrap{display:flex;flex-direction:column;gap:12px;padding:16px 14px 24px}

/* Hairline-separated tiles rather than four floating cards: the 1px grid gap
   over a line-coloured backing is the rule between them. */
.stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.stat{background:var(--surface);padding:11px 12px}
.stat .k{
  display:block;
  font-family:var(--font-m);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.stat b{
  display:block;margin-top:2px;
  font-family:var(--font-d);font-size:23px;font-weight:600;
  letter-spacing:.02em;line-height:1.15;
}
.stat small{display:block;font-size:11px;line-height:1.35;color:var(--ink-3)}

.card{
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
  padding:13px 13px 15px;
}
.card h3{font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:10px;
}
.card > h3{margin-bottom:10px}
.card select{margin-bottom:4px}
.card .hint{margin-top:10px}


/* ==========================================================================
   Charts

   Every colour here is a token, so the SVG follows the theme without any
   JavaScript knowing which theme is on.
   ========================================================================== */

.chart-host{margin-top:4px}
.chart{display:block;width:100%;touch-action:pan-y}

.chart-read{display:flex;align-items:baseline;gap:9px;min-height:28px;flex-wrap:wrap}
.chart-read b{
  font-family:var(--font-d);font-size:23px;font-weight:600;letter-spacing:.02em;
  line-height:1.1;
}
.chart-read span{
  font-family:var(--font-m);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);
}
/* The one hero figure on the view — the number the whole tab is about. */
.chart-host.hero .chart-read b{font-size:clamp(30px,9vw,44px)}

.chart-empty{
  padding:28px 6px;font-size:13px;line-height:1.5;color:var(--ink-3);
}

.c-grid{stroke:var(--line-soft);stroke-width:1}
.c-tick{
  fill:var(--ink-3);
  font-family:var(--font-m);font-size:10px;font-variant-numeric:tabular-nums;
}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent);fill-opacity:.10;stroke:none}
.c-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-bar{fill:var(--accent);fill-opacity:.8}
.c-bar[data-hi="1"]{fill-opacity:1}
.c-cross line{stroke:var(--ink-3);stroke-width:1}
.c-cross circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}


/* ==========================================================================
   Consistency grid — a column per week, a row per weekday
   ========================================================================== */

.cal{display:flex;gap:5px;align-items:stretch}
.cal-head{
  display:grid;grid-template-rows:repeat(7,1fr);gap:4px;flex:none;
}
.cal-h{
  display:flex;align-items:center;
  font-family:var(--font-m);font-size:9px;color:var(--ink-3);
}
.cal-grid{
  flex:1;min-width:0;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  grid-template-rows:repeat(7,1fr);gap:4px;
}

.cal-c{
  display:block;aspect-ratio:1;border-radius:3px;
  background:var(--line-soft);border:1px solid transparent;
}
.cal-c[data-state="trained"]{background:var(--accent)}
.cal-c[data-state="trained"][data-level="1"]{opacity:.4}
.cal-c[data-state="trained"][data-level="2"]{opacity:.7}
.cal-c[data-state="trained"][data-level="3"]{opacity:1}
/* Both "you didn't train" states are rings rather than fills, so neither can
   be mistaken for a trained day at a glance, and they match each other in
   weight — grey for one you meant to take, red for one you didn't. */
.cal-c[data-state="rest"]{background:var(--surface-2);border-color:var(--ink-3);border-width:1.5px}
.cal-c[data-state="missed"]{background:transparent;border-color:var(--danger);border-width:1.5px}

.cal-key{
  display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;
  font-size:11.5px;color:var(--ink-2);
}
.cal-key span{display:flex;align-items:center;gap:6px}
.cal-key .cal-c{width:11px;height:11px;aspect-ratio:auto;flex:none}


/* ==========================================================================
   Weigh-in sheet
   ========================================================================== */

.bwlist{display:flex;flex-direction:column}
.bwrow{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
.bwrow:last-child{border-bottom:0}
.bwrow span{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.bwrow b{
  font-family:var(--font-m);font-size:13.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
}


/* ==========================================================================
   What the last session changed

   Four states, and never colour alone: each carries its own word. Amber for
   a load that went up, teal for one deliberately backed off, plain ink for
   a hold, and an accent rule down the side for a slot that changed hands.
   ========================================================================== */

.planbar{
  display:flex;align-items:baseline;gap:10px;
  margin:0 14px 12px;padding:9px 12px;
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r);background:var(--surface);
}
.planbar .k{
  flex:none;font-family:var(--font-m);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.planbar b{font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:.03em}

.ex-plan{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px;
  margin-top:9px;padding-left:9px;
  border-left:2px solid var(--line);
  font-size:12px;line-height:1.4;
}
.ex-plan b{
  font-family:var(--font-m);font-size:11.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.ex-plan span{color:var(--ink-3)}

.ex-plan[data-kind="up"]{border-left-color:var(--accent)}
.ex-plan[data-kind="up"] b{color:var(--accent)}
.ex-plan[data-kind="down"]{border-left-color:var(--good)}
.ex-plan[data-kind="down"] b{color:var(--good)}
.ex-plan[data-kind="swap"]{border-left-color:var(--accent);background:var(--accent-soft);
  padding:7px 9px;border-radius:0 6px 6px 0}
.ex-plan[data-kind="swap"] b{color:var(--accent)}
.ex-plan[data-kind="hold"] b,
.ex-plan[data-kind="open"] b{color:var(--ink-2)}


/* ==========================================================================
   Settings rows that need the full width for their control
   ========================================================================== */

.setrow.stack{
  display:block;
  padding:4px 0 2px;
}
.setrow.stack .k{margin-bottom:8px}
.setrow.stack .k small{margin-top:2px}

.rowbtns.two{grid-template-columns:1fr 1fr}


/* ==========================================================================
   Importing past training
   ========================================================================== */

textarea.tall{
  min-height:190px;
  /* 16px like every other field: anything smaller and Safari zooms the page
     to meet it the moment it takes focus. */
  font-family:var(--font-m);font-size:16px;line-height:1.5;
  font-variant-numeric:tabular-nums;
  /* Keep the line breaks that separate one day from the next, but let a long
     exercise line wrap. A sideways scrollbar inside a sheet that already
     scrolls down is a fight on a touchscreen. */
  white-space:pre-wrap;overflow-wrap:break-word;
}

/* The format guide. Closed by default — it is reference, not instruction,
   and the placeholder in the box above already shows the shape. */
.fmt{
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);
}
.fmt summary{
  padding:12px 13px;cursor:pointer;
  font-family:var(--font-d);font-size:14px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
}
.fmt ul{margin:0;padding:0 14px 4px 30px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.fmt li{margin-bottom:4px}
.fmt li b{font-weight:600;color:var(--ink)}
.fmt .hint{padding:0 14px 13px}
.fmt code{
  font-family:var(--font-m);font-size:11.5px;
  padding:1px 5px;border-radius:4px;
  background:var(--surface-2);color:var(--ink);
}

.impview{display:flex;flex-direction:column;gap:8px}

.improw{
  display:flex;align-items:baseline;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--line-soft);
}
.improw:last-child{border-bottom:0}
.improw span{
  flex:none;width:74px;
  font-family:var(--font-m);font-size:11px;color:var(--ink-3);
}
.improw b{flex:1;min-width:0;font-family:var(--font-d);font-size:14px;font-weight:600}
.improw small{flex:none;font-size:11px;color:var(--ink-3)}

/* Lines the parser could not read. Stated plainly rather than hidden — an
   import you cannot check is one you cannot trust. */
.impwarn{
  padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--danger);
  font-size:12.5px;line-height:1.45;color:var(--danger);
}

.rowbtns button[disabled]{opacity:.45}

</style>

  var d = new Date(ts);

function fromDayKey(key, keepTimeFrom){

    parseInt(bits[0], 10),
    parseInt(bits[1], 10) - 1,
    parseInt(bits[2], 10)

}

  var found = String(reps).match(/\d+/g);

  var low = parseInt(found[0], 10);
  var high = parseInt(found[found.length - 1], 10);
  if(high < low) high = low;
  if(high - low > 7) return [low, high];        /* silly-wide target, just ends */
  var out = [];

   mark a miss and then train after all, and the miss stops counting. The
   calendar and the counts both defer to this so they can't disagree. */
function skipsOnly(){
  var trained = trainedDays();
  return state.history.filter(function(h){
    return isSkip(h) && !trained[dayKey(h.at)];
  });
}

function sortHistory(){
  state.history.sort(function(a, b){ return a.at - b.at; });
}

function findEntry(id){
  for(var i = 0; i < state.history.length; i++){
    if(state.history[i].id === id) return state.history[i];
  }
  return null;
}

function removeEntry(id){
  for(var i = 0; i < state.history.length; i++){
    if(state.history[i].id === id){
      state.history.splice(i, 1);
      save();
      return true;
    }
  }
  return false;
}

/* Move a logged day to a different date, keeping the time of day it was
   finished at — the date is the part you'd want to correct, not the clock. */
function setEntryDate(id, key){
  var h = findEntry(id);
  if(!h) return false;
  h.at = fromDayKey(key, h.at);
  sortHistory();
  save();
  return true;
}

/* A day you didn't train. "missed" is one you owe; "rest" is one you planned.
   Neither advances the rotation — the workout you skipped is still the next
   one up, which is what you'd actually do at the gym. */
function addSkip(key, skipType, dayIndex, note){
  var day = state.days[dayIndex] || currentDay();
  var entry = {
    id: uid("h"),
    at: fromDayKey(key),
    kind: "skip",
    skipType: skipType === "rest" ? "rest" : "missed",
    dayId: day.id,
    dayName: day.name,
    notes: note || "",
    unit: state.prefs.unit,
    volume: 0,
    entries: []
  };
  state.history.push(entry);
  sortHistory();
  save();
  return entry;
}

/* --------------------------------------------------------------------------
   Bodyweight

   One entry per calendar day — weighing yourself twice on a Tuesday means
   the second reading replaces the first rather than making two points.
   -------------------------------------------------------------------------- */

function addBodyweight(w, key){
  var weight = Math.max(0, Math.round((parseFloat(w) || 0) * 10) / 10);
  if(!weight) return null;

  var at = fromDayKey(key || dayKey(Date.now()));
  var k = dayKey(at);
  var existing = null;

  state.body.forEach(function(b){ if(dayKey(b.at) === k) existing = b; });

  if(existing){
    existing.w = weight;
  }else{
    existing = { at:at, w:weight };
    state.body.push(existing);
  }

  state.body.sort(function(a, b){ return a.at - b.at; });
  save();
  return existing;
}

function removeBodyweight(at){
  state.body = state.body.filter(function(b){ return b.at !== at; });
  save();
}

function latestBodyweight(){
  return state.body.length ? state.body[state.body.length - 1] : null;
}

/* What you weighed around a given date. Walks back to the last reading on or
   before it; if the log only starts later, the earliest reading stands in,
   because a rough number beats dropping the point entirely. */
function bodyweightAt(ts){
  if(!state.body.length) return 0;
  var best = 0;
  for(var i = 0; i < state.body.length; i++){
    if(state.body[i].at <= ts) best = state.body[i].w;
    else break;
  }
  return best || state.body[0].w;
}

/* --------------------------------------------------------------------------
   Progress — turning the log into something plottable
   -------------------------------------------------------------------------- */

/* Epley. It's an estimate and it drifts above about ten reps, but it's the
   standard one and this only ever feeds a trend line, where consistency
   matters more than absolute truth. */
function e1rm(w, r){
  if(!w || !r) return 0;
  return w * (1 + r / 30);
}

/* Every movement you've actually logged, most-trained first — the order the
   exercise picker offers them in. */
function loggedExercises(){
  var counts = {};
  sessionsOnly().forEach(function(h){
    h.entries.forEach(function(en){
      if(en.completed > 0) counts[en.name] = (counts[en.name] || 0) + 1;
    });
  });
  return Object.keys(counts).sort(function(a, b){
    return counts[b] - counts[a] || a.localeCompare(b);
  });
}

/* The strength trend for one movement.

   metric "load" is an estimated 1RM, and for pull-ups and dips your
   bodyweight at the time is added in — a chin-up at 150lb and the same rep
   at 190lb are not the same lift. metric "reps" is the fallback for anything
   never logged with a load (and no bodyweight on file to supply one), where
   more reps IS the progress. */
function exerciseSeries(name){
  var raw = [];
  var anyLoad = false;

  sessionsOnly().forEach(function(h){
    h.entries.forEach(function(en){
      if(en.name !== name || !en.completed) return;

      var bw = bodyweightAt(h.at);
      var carried = data.BODYWEIGHT[name] ? bw : 0;
      var best = 0;
      var reps = 0;

      (en.logged || []).forEach(function(item){
        item.segs.forEach(function(s){
          best = Math.max(best, e1rm((s.w || 0) + carried, s.r));
        });
        reps = Math.max(reps, totalReps(item.segs));
      });

      if(best > 0) anyLoad = true;
      raw.push({ at:h.at, load:best, reps:reps, bw:bw });
    });
  });

  var metric = anyLoad ? "load" : "reps";
  var points = [];

  raw.forEach(function(p){
    var v = metric === "load" ? p.load : p.reps;
    if(!v) return;                      /* a session with nothing usable */
    points.push({ x:p.at, y:Math.round(v * 10) / 10, bw:p.bw });
  });

  return { name:name, metric:metric, points:points };
}

/* The same series divided by what you weighed that week — "am I getting
   stronger for my size", which is the question a changing bodyweight makes
   hard to answer from load alone. Points with no bodyweight on file can't
   be expressed this way and are left out. */
function relativeSeries(series){
  return {
    name: series.name,
    metric: series.metric,
    points: series.points.filter(function(p){ return p.bw > 0; }).map(function(p){
      return { x:p.x, y:Math.round(p.y / p.bw * 100) / 100, bw:p.bw };
    })
  };
}

function volumeSeries(){
  return sessionsOnly().map(function(h){
    return { x:h.at, y:h.volume || 0 };
  });
}

function bodySeries(){
  return state.body.map(function(b){ return { x:b.at, y:b.w }; });
}

/* One row per calendar day for the consistency grid, oldest first, always
   starting on a Sunday so the columns line up as weeks. */
function calendar(weeks){
  var byDay = {};
  state.history.forEach(function(h){
    var k = dayKey(h.at);
    /* A session outranks a skip on the same date — if you logged a workout,
       that day counts as trained whatever else got recorded. */
    if(!byDay[k] || isSkip(byDay[k])) byDay[k] = h;
  });

  var end = startOfDay(Date.now());
  var cursor = new Date(end);
  cursor.setDate(cursor.getDate() - (weeks * 7 - 1));
  cursor.setDate(cursor.getDate() - cursor.getDay());     /* back to Sunday */

  var volumes = sessionsOnly().map(function(h){ return h.volume || 0; })
                              .filter(function(v){ return v > 0; })
                              .sort(function(a, b){ return a - b; });
  var mid = volumes.length ? volumes[Math.floor(volumes.length / 2)] : 0;

  var cells = [];
  var day = cursor.getTime();

  while(startOfDay(day) <= end){
    var k = dayKey(day);
    var hit = byDay[k];
    var level = 0;

    if(hit && !isSkip(hit)){
      level = !mid ? 2 : (hit.volume >= mid * 1.25 ? 3 : hit.volume >= mid * 0.6 ? 2 : 1);
    }

    cells.push({
      at: day,
      key: k,
      state: hit ? (isSkip(hit) ? hit.skipType : "trained") : "none",
      level: level,
      entry: hit || null
    });

    day += DAY_MS;
    day = startOfDay(day) + DAY_MS / 2;   /* re-anchor at midday past DST */
  }

  return cells;
}

/* The headline numbers above the charts. */
function summary(){
  var sessions = sessionsOnly();
  var first = state.history.length ? state.history[0].at : null;
  var since = first ? Math.max(1, Math.ceil((daysBetween(first, Date.now()) + 1) / 7)) : 0;

  var monthAgo = Date.now() - 30 * DAY_MS;
  var recent = sessions.filter(function(h){ return h.at >= monthAgo; });
  var missed = skipsOnly().filter(function(h){
    return h.skipType === "missed" && h.at >= monthAgo;
  });

  var bw = latestBodyweight();
  var firstBw = state.body.length ? state.body[0] : null;

  return {
    sessions: sessions.length,
    weeks: since,
    since: first,
    last30: recent.length,
    missed30: missed.length,
    volume: sessions.reduce(function(n, h){ return n + (h.volume || 0); }, 0),
    bodyweight: bw ? bw.w : 0,
    bodyweightDelta: (bw && firstBw && bw !== firstBw) ? Math.round((bw.w - firstBw.w) * 10) / 10 : 0
  };
}

/* --------------------------------------------------------------------------
   Mutations
   -------------------------------------------------------------------------- */

function newExercise(name){ return planned(name); }

function clampSets(n){
  return Math.min(MAX_SETS, Math.max(1, parseInt(n, 10) || 1));
}

function setSets(e, n){
  e.sets = clampSets(n);
  e.log.length = e.sets;   /* drop logs for sets that no longer exist */
  return e.sets;
}

function addWeight(e, delta){
  /* Round to 2dp so 2.5 steps don't drift into float noise. */
  e.weight = Math.max(0, Math.round(((+e.weight || 0) + delta) * 100) / 100);
  return e.weight;
}

/* One tap: assume the working weight and the top of the rep target. */
function quickLog(e, k){
  e.log[k] = [{ w:(e.weight || 0), r:repTop(e.reps) }];
  return e.log[k];
}

function clearSet(e, k){ e.log[k] = null; }

/* A drop starts one step lighter and at roughly half the reps — both are
   just a sensible place for the steppers to begin. */
function addSegment(e, k){
  var segs = e.log[k];
  if(!segs) segs = quickLog(e, k);
  var prev = segs[segs.length - 1];
  segs.push({
    w: Math.max(0, Math.round((prev.w - state.prefs.step) * 100) / 100),
    r: Math.max(1, Math.round(prev.r / 2))
  });
  return segs;
}

function removeSegment(e, k, index){
  var segs = e.log[k];
  if(!segs || segs.length <= 1) return false;
  segs.splice(index, 1);
  return true;
}

function setSegmentWeight(e, k, index, value){
  var seg = e.log[k] && e.log[k][index];
  if(!seg) return 0;
  seg.w = Math.max(0, Math.round((value || 0) * 100) / 100);
  return seg.w;
}

function setSegmentReps(e, k, index, value){
  var seg = e.log[k] && e.log[k][index];
  if(!seg) return 0;
  seg.r = Math.min(999, Math.max(0, parseInt(value, 10) || 0));
  return seg.r;
}

function moveExercise(day, from, to){
  if(to < 0 || to >= day.ex.length) return false;
  var moved = day.ex.splice(from, 1)[0];
  day.ex.splice(to, 0, moved);
  return true;
}

/* Log the session, clear the sets, advance the rotation.
   Returns the finished day so the caller can report on it. */
function finishSession(){
  var day = currentDay();
  var volume = 0;

  var entries = day.ex.map(function(e){
    var logged = [];
    var heaviest = 0;
    var exVolume = 0;

    for(var k = 0; k < e.sets; k++){
      if(!isLogged(e, k)) continue;
      var segs = e.log[k].map(function(s){ return { w:s.w, r:s.r }; });
      logged.push({ set:k + 1, segs:segs });
      heaviest = Math.max(heaviest, topWeight(segs));
      exVolume += segmentVolume(segs);
    }

    volume += exVolume;
    return {
      name: e.name,
      sets: e.sets,
      target: e.reps,
      completed: logged.length,
      topWeight: heaviest,
      volume: Math.round(exVolume),
      logged: logged
    };
  });

  var record = {
    id: uid("h"),
    at: Date.now(),
    kind: "session",
    dayId: day.id,
    dayName: day.name,
    notes: day.notes,
    unit: state.prefs.unit,
    volume: Math.round(volume),
    entries: entries
  };

  state.history.push(record);
  sortHistory();   /* a backdated skip may already sit after "now" */

  day.ex.forEach(function(e){ e.log = []; });
  day.notes = "";

  /* Set the day up for next time while the session is still in hand: loads
     move on what you actually hit, and a slot or two may change hands. It
     happens here rather than in app.js so every route to a finished session
     gets the same treatment. */
  var changes = IL.plan ? IL.plan.advance(day, record) : [];

  if(state.day === state.days.length - 1) state.cycle++;
  state.day = (state.day + 1) % state.days.length;

  save();
  return { day:day, record:record, changes:changes };
}

/* --------------------------------------------------------------------------
   Getting the data out (and back in)

   Nothing here talks to the network. These produce text; app.js decides
   whether that text becomes a download or goes into the share sheet.
   -------------------------------------------------------------------------- */

function csvCell(v){
  var s = (v === null || v === undefined) ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/* One row per weight lifted — a set with a drop in it is two rows sharing a
   set number, so nothing is averaged away before it reaches a spreadsheet.
   Skipped days get a row of their own so the gaps are explicit. */
function toCSV(){
  var rows = [[
    "date","time","day","type","exercise","set","segment",
    "weight","reps","unit","volume","bodyweight","notes"
  ]];

  state.history.forEach(function(h){
    var d = new Date(h.at);
    var date = dayKey(h.at);
    var time = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    var bw = bodyweightAt(h.at) || "";
    var noteUsed = false;

    function note(){
      if(noteUsed) return "";
      noteUsed = true;
      return h.notes || "";
    }

    if(isSkip(h)){
      rows.push([date, time, h.dayName, h.skipType, "", "", "", "", "", "", 0, bw, note()]);
      return;
    }

    h.entries.forEach(function(en){
      if(!en.logged || !en.logged.length){
        rows.push([date, time, h.dayName, "not done", en.name, "", "", "", "",
                   h.unit || "lb", 0, bw, note()]);
        return;
      }
      en.logged.forEach(function(item){
        item.segs.forEach(function(s, i){
          rows.push([
            date, time, h.dayName, "set", en.name, item.set, i + 1,
            s.w || 0, s.r || 0, h.unit || "lb",
            Math.round((s.w || 0) * (s.r || 0)), bw, note()
          ]);
        });
      });
    });
  });

  /* Weigh-ins ride along in the same file, so one export is the whole story. */
  state.body.forEach(function(b){
    rows.push([dayKey(b.at), "", "", "weigh-in", "", "", "", b.w, "",
               state.prefs.unit, "", b.w, ""]);
  });

  return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
}

function toBackup(){
  return JSON.stringify(state, null, 2);
}

/* Replace everything with a backup file. Throws if the text isn't one, so
   the caller can tell you rather than silently wiping the log. */
function restore(text){
  var incoming = JSON.parse(text);
  if(!looksLikeSave(incoming)) throw new Error("Not an Iron Ledger backup.");
  state = normalize(incoming);
  save();
  return state;
}

function exportName(ext){
  return "iron-ledger-" + dayKey(Date.now()) + "." + ext;
}

  repBottom: repBottom,
  repChoices: repChoices,
  totalReps: totalReps,
  segmentVolume: segmentVolume,
  topWeight: topWeight,

  customLib: customLib,
  libLookup: libLookup,

  libResolve: libResolve,
  isCustom: isCustom,

  clearSet: clearSet,
  addSegment: addSegment,

/* ==========================================================================
   plan.js — the part that decides what next week looks like.

   Three jobs, all of them reading the log and writing the plan:

     overload()   what load and rep target this exercise has earned
     advance()    run after a finished session: move the loads, and let a
                  slot or two change hands so the day is never identical
     reseed()     re-derive every working weight from history, which is what
                  makes importing old training worth doing

   plus the importer, which turns notebook shorthand into real sessions.

   NOTHING HERE INVENTS A NUMBER. Every decision is made from a set you
   actually logged, which is why an empty log leaves the plan alone.
   ========================================================================== */

window.IL = window.IL || {};

(function(IL){
"use strict";

var store = IL.store;

/* Load rounded onto the increment you actually have — plates, pins, the
   dumbbell rack's next pair up. */
function toStep(w){
  var step = store.state.prefs.step || 5;
  return Math.max(0, Math.round(w / step) * step);
}

function downStep(w){
  var step = store.state.prefs.step || 5;
  return Math.max(step, Math.floor(w / step) * step);
}

/* --------------------------------------------------------------------------
   Double progression

   In one sentence: earn the top of the rep range on every set and the load
   goes up; hold the range and the load stays while you chase reps; fall out
   of the bottom of it twice and the load comes down.

   `last` is what store.lastEntryFor() hands back — a whole logged entry, so
   the rule can see every set rather than an average.
   -------------------------------------------------------------------------- */
function overload(e, last){
  var unit = store.state.prefs.unit;
  var step = store.state.prefs.step || 5;

  /* Never trained, or trained and nothing recorded: there is no evidence to
     act on, so the plan is left exactly as it is. */
  if(!last || !last.entry || !last.entry.completed){
    return {
      kind: "open",
      weight: e.weight || 0,
      reps: e.reps,
      note: "no logged sets yet — find a working weight"
    };
  }

  var en = last.entry;
  var target = en.target || e.reps;
  var top = store.repTop(target);
  var bottom = store.repBottom(target);
  var plannedSets = en.sets || e.sets;

  var reps = (en.logged || []).map(function(item){
    return store.totalReps(item.segs);
  });
  var lowest = reps.length ? Math.min.apply(null, reps) : 0;
  var missing = Math.max(0, plannedSets - reps.length);
  var under = reps.filter(function(r){ return r < bottom; }).length;
  var loaded = en.topWeight > 0;

  /* Earned it — every planned set at the top of the range. */
  if(!missing && lowest >= top){
    if(loaded){
      return {
        kind: "up",
        weight: toStep(en.topWeight + step),
        reps: e.reps,
        note: "+" + step + " " + unit + " — all " + plannedSets +
              " sets hit " + top
      };
    }
    /* Bodyweight with nothing hanging off you: reps ARE the progression. */
    return {
      kind: "up",
      weight: 0,
      reps: (bottom + 1) + "-" + (top + 1),
      note: "target up to " + (bottom + 1) + "-" + (top + 1) +
            " — you cleared " + top + " on every set"
    };
  }

  /* Inside the range everywhere: same load, more reps. */
  if(!under && !missing){
    return {
      kind: "hold",
      weight: loaded ? en.topWeight : 0,
      reps: e.reps,
      note: "same load — chase " + top + " on all " + plannedSets + " sets"
    };
  }

  /* Two or more sets that you DID do coming in under the bottom of the range
     is a load problem, not a bad night's sleep. Back off enough to rebuild,
     not enough to lose the month it took to get there.

     Sets you never logged are deliberately not counted here: leaving the gym
     early is a short session, and taking weight off the bar for it would
     punish you for something the bar didn't do. */
  if(under >= 2 && loaded){
    var lighter = downStep(en.topWeight * 0.9);
    return {
      kind: "down",
      weight: lighter,
      reps: e.reps,
      note: "−" + Math.round(en.topWeight - lighter) + " " + unit +
            " to rebuild — " + under + " sets came in under " + bottom
    };
  }

  return {
    kind: "hold",
    weight: loaded ? en.topWeight : 0,
    reps: e.reps,
    note: missing
      ? "same load — " + missing + (missing === 1 ? " set" : " sets") +
        " of " + plannedSets + " went unlogged"
      : "same load — a set came in under " + bottom
  };
}

/* --------------------------------------------------------------------------

   A slot keeps its job and changes its exercise. Two rules keep that from
   becoming a shuffle:

/* Everything the four days are currently using, so Lower A and Lower B

  var used = inUse(e.uid);
  var options = pool.filter(function(n){ return n !== e.name && !used[n]; });
  if(!options.length) return "";

  options.sort(function(a, b){
    return lastTouched(a) - lastTouched(b) || a.localeCompare(b);

function advance(day, record){

    e.rotAge = (e.rotAge || 0) + 1;

    /* entries are built in plan order, so the index is exact; the name is
       there as a belt-and-braces fallback. */
    var en = (entries[i] && entries[i].name === e.name) ? entries[i] : byName[e.name];

    /* Progression off, or nothing logged against this one: clear the chip
       rather than leave it. Advice from three weeks ago, still sitting under
       an exercise as though it were about today, is worse than no advice. */
    if(!p.autoProgress || !en){
      e.progress = null;
      return;
    }

    var res = overload(e, { at:record.at, unit:record.unit, entry:en });
    if(res.kind === "open"){
      e.progress = null;
      return;
    }

    e.weight = res.weight;
    e.reps = res.reps;
    e.progress = { kind:res.kind, note:res.note };
    changes.push({ name:e.name, kind:res.kind, note:res.note });
  });

  var rules = store.varietyRules();
  if(!rules.cap) return changes;

  /* Oldest slot first, and never more than the cap in one go — "a little
     bit different", not a new program every week. */
  var queue = day.ex.slice().sort(function(a, b){
    return (b.rotAge || 0) - (a.rotAge || 0);
  });
  var swapped = 0;
  var heavy = 0;

  queue.forEach(function(e){
    if(swapped >= rules.cap || e.pin) return;

    var compound = store.typeOf(e.name) === "compound";
    var due = compound ? rules.compound : rules.other;
    if((e.rotAge || 0) < due) return;

    /* Only ever one of the heavy movements at a time. Two compounds changing
       in the same session means walking in with no idea what any of it
       should weigh, which is the opposite of progressive overload. */
    if(compound && heavy) return;

    var next = nextAlternative(e);
    if(!next) return;

    var from = e.name;
    var def = store.libLookup(next);
    var seen = store.lastEntryFor(next);

    e.name = next;
    e.reps = String(def.reps);
    e.note = "";                 /* the old note was about the old machine */
    e.log = [];
    e.rotAge = 0;
    e.weight = seen ? overload(e, seen).weight : 0;
    e.progress = {
      kind: "swap",
      note: seen
        ? "in for " + from + " — you had " + seen.entry.topWeight + " " +
          seen.unit + " on it last time"
        : "in for " + from + " — new, find a working weight"
    };

    changes.push({ name:next, from:from, kind:"swap", note:e.progress.note });
    swapped++;
    if(compound) heavy++;
  });

  return changes;
}

/* --------------------------------------------------------------------------
   Re-deriving the whole plan from the log

   Paste in a month of old training, press this, and every day in the
   rotation opens at the load your own history says you have earned. Also
   the repair button for a plan that has drifted away from reality.
   -------------------------------------------------------------------------- */
function reseed(){
  var touched = 0;

  store.state.days.forEach(function(day){
    day.ex.forEach(function(e){
      var last = store.lastEntryFor(e.name);
      if(!last) return;

      var res = overload(e, last);
      if(res.kind === "open") return;

      e.weight = res.weight;
      e.reps = res.reps;
      e.progress = { kind:res.kind, note:res.note };
      touched++;
    });
  });

  store.save();
  return touched;
}

/* --------------------------------------------------------------------------
   Importing training you already did

   The format is what you would scribble in a notebook:

     2026-08-25 Upper A
     Incline Smith Press 135x8 135x8 145x6
     Barbell Bent-Over Row 155x8x3
     Pull-Ups BWx9 BWx7
     Cable Crunch 60x15, 60x15
     note: incline felt easy

   A line that starts with a date starts a new day, and whatever follows the
   date says which workout it was. Every other line is one exercise: its
   name, then its sets.
   -------------------------------------------------------------------------- */

var MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];

function fullYear(y){ return y < 100 ? 2000 + y : y; }

/* No year given means the most recent one that isn't in the future — you're
   typing up training you have already done, not booking it. */
function stamp(y, mo, d, rest){
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;

  var now = new Date();
  var at = new Date(y || now.getFullYear(), mo - 1, d, 12, 0, 0, 0);

  if(!y && at.getTime() > now.getTime() + 86400000){
    at = new Date(now.getFullYear() - 1, mo - 1, d, 12, 0, 0, 0);
  }
  if(isNaN(at.getTime())) return null;

  return { at:at.getTime(), rest:String(rest || "").trim() };
}

/* Reads a date off the front of a line and hands back the timestamp plus
   whatever text followed it. null means "this isn't a header", which is how
   the parser tells a day from an exercise. */
function readDate(line){
  var s = String(line).trim();
  var m;

  m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b(.*)$/);
  if(m) return stamp(+m[1], +m[2], +m[3], m[4]);

  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?(?![\d])(.*)$/);
  if(m) return stamp(m[3] ? fullYear(+m[3]) : 0, +m[1], +m[2], m[4]);

  m = s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?\b(.*)$/);
  if(m){
    var mi = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
    if(mi >= 0) return stamp(m[3] ? +m[3] : 0, mi + 1, +m[2], m[4]);
  }

  m = s.match(/^(today|yesterday)\b(.*)$/i);
  if(m){
    var back = m[1].toLowerCase() === "yesterday" ? 86400000 : 0;
    return {
      at: store.fromDayKey(store.dayKey(Date.now() - back)),
      rest: String(m[2] || "").trim()
    };
  }

  return null;
}

/* Understood, in any mix, separated by spaces or commas:

     135x8         one set
     135x8x3       that same set three times
     135 x 8       spaces are fine, so are * and @
     BWx9          bodyweight
     185x5+155x3   one set with a drop in it
     8 8 6         reps only, for a line with no load to record
*/
var SET_TOKEN = /^(?:bw|\d+(?:\.\d+)?)x\d+(?:x\d+)?(?:\+(?:bw|\d+(?:\.\d+)?)x\d+)*$/i;
var BARE_REPS = /^\d{1,3}$/;

/* Close up the gaps so every set becomes one token.

   Two details earn their keep. The digit-or-bw guard on the left stops the x
   in "Box Squat" being eaten. And the right-hand side is a LOOKAHEAD, not a
   capture — matching it would consume the digit, and "155 x 8 x 3" needs
   that 8 still available to pair with the second x. */
function tighten(line){
  var s = String(line);
  s = s.replace(/[×✕]/g, "x").replace(/[–—]/g, "-");
  s = s.replace(/(\d)\s*(?:lbs?|kgs?|#)\b/gi, "$1");
  s = s.replace(/(\d|bw)\s*[x*@]\s*(?=\d)/gi, "$1x");
  s = s.replace(/(\d)\s*\+\s*(?=\d|bw)/gi, "$1+");
  return s;
}

function readExercise(line){
  var s = tighten(line).trim();
  if(!s) return null;

  var tokens = s.split(/[\s,;]+/).filter(Boolean);
  var cut = tokens.length;
  var hasSpec = false;

  while(cut > 0 && SET_TOKEN.test(tokens[cut - 1])){
    hasSpec = true;
    cut--;
  }

  /* No "weight x reps" anywhere on the line: a trailing run of bare numbers
     is reps with nothing on the bar — sit-ups, planks, pull-ups from before
     you started hanging plates off yourself. */
  if(!hasSpec){
    while(cut > 0 && BARE_REPS.test(tokens[cut - 1])) cut--;
  }

  var name = tokens.slice(0, cut).join(" ").replace(/[:\-]\s*$/, "").trim();
  var specs = tokens.slice(cut);
  if(!name || !specs.length) return null;

  var sets = [];

  specs.forEach(function(tok){
    if(BARE_REPS.test(tok)){
      sets.push([{ w:0, r:parseInt(tok, 10) }]);
      return;
    }

    var repeat = 1;
    var segs = [];

    tok.split("+").forEach(function(part, i){
      var bits = part.split(/x/i);
      segs.push({
        w: /^bw$/i.test(bits[0]) ? 0 : (parseFloat(bits[0]) || 0),
        r: parseInt(bits[1], 10) || 0
      });
      if(i === 0 && bits[2]) repeat = Math.min(12, parseInt(bits[2], 10) || 1);
    });

    for(var n = 0; n < repeat; n++){
      sets.push(segs.map(function(sg){ return { w:sg.w, r:sg.r }; }));
    }
  });

  return { name:name, sets:sets };
}

function parseImport(text){
  var lines = String(text || "").split(/\r?\n/);
  var sessions = [];
  var errors = [];
  var unknown = {};
  var current = null;

  lines.forEach(function(raw, i){
    var line = raw.trim();
    if(!line || line.charAt(0) === "#") return;

    var head = readDate(line);
    if(head){
      current = { at:head.at, dayName:head.rest, notes:"", entries:[] };
      sessions.push(current);
      return;
    }

    var noteHit = line.match(/^(?:notes?|comment)\s*[:\-]\s*(.*)$/i);
    if(noteHit && current){
      current.notes = current.notes ? current.notes + " " + noteHit[1] : noteHit[1];
      return;
    }

    if(!current){
      errors.push({ line:i + 1, text:line, why:"no date above it" });
      return;
    }

    var ex = readExercise(line);
    if(!ex){
      errors.push({ line:i + 1, text:line, why:"no sets found in it" });
      return;
    }

    var canonical = store.libResolve(ex.name);
    if(!canonical) unknown[ex.name] = true;

    current.entries.push({ name:canonical || ex.name, sets:ex.sets });
  });

  /* A date with nothing under it is a stray header, not a session. */
  sessions = sessions.filter(function(s){ return s.entries.length; });
  sessions.sort(function(a, b){ return a.at - b.at; });

  var sets = 0;
  var volume = 0;
  sessions.forEach(function(s){
    s.entries.forEach(function(en){
      sets += en.sets.length;
      en.sets.forEach(function(segs){ volume += store.segmentVolume(segs); });
    });
  });

  return {
    sessions: sessions,
    errors: errors,
    unknown: Object.keys(unknown),
    sets: sets,
    volume: Math.round(volume)
  };
}

/* "upper a", "UA" and "Upper-A" all find the day. When the text matches
   none of them the session keeps its own label — an imported day from a
   program you no longer run is still a real day you trained. */
function matchDay(text){
  var want = String(text || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  if(!want) return null;

  var days = store.state.days;
  var i;
  var keys = days.map(function(d){
    return d.name.toLowerCase().replace(/[^a-z0-9]+/g, "");
  });

  for(i = 0; i < days.length; i++){
    if(want === days[i].id.toLowerCase() || want === keys[i]) return days[i];
  }
  for(i = 0; i < days.length; i++){
    if(want.indexOf(keys[i]) >= 0 || keys[i].indexOf(want) >= 0) return days[i];
  }
  return null;
}

/* Turn parsed sessions into real history.

   Volume, top weight and completed counts are computed exactly the way a
   live session computes them, so an imported day and a logged one are the
   same kind of thing to everything downstream — the charts, the totals, the
   "last time" line, and the progression rules. */
function commitImport(parsed, opts){
  opts = opts || {};
  var learned = 0;

  if(opts.learn !== false){
    parsed.unknown.forEach(function(name){
      if(store.addCustomExercise({ name:name, group:"Imported" })) learned++;
    });
  }

  parsed.sessions.forEach(function(s){
    var volume = 0;

    var entries = s.entries.map(function(en){
      var def = store.libLookup(en.name);
      var logged = [];
      var heaviest = 0;
      var exVolume = 0;

      en.sets.forEach(function(segs, k){
        logged.push({ set:k + 1, segs:segs });
        heaviest = Math.max(heaviest, store.topWeight(segs));
        exVolume += store.segmentVolume(segs);
      });

      volume += exVolume;
      return {
        name: en.name,
        sets: logged.length,
        target: String(def.reps || "8-10"),
        completed: logged.length,
        topWeight: heaviest,
        volume: Math.round(exVolume),
        logged: logged
      };
    });

    var day = matchDay(s.dayName);
    store.state.history.push({
      id: store.uid("h"),
      at: s.at,
      kind: "session",
      dayId: day ? day.id : "IM",
      dayName: day ? day.name : (s.dayName || "Imported"),
      notes: s.notes,
      unit: store.state.prefs.unit,
      volume: Math.round(volume),
      entries: entries
    });
  });

  store.sortHistory();
  store.save();

  return { sessions:parsed.sessions.length, learned:learned };
}

IL.plan = {
  overload: overload,
  advance: advance,
  reseed: reseed,
  nextAlternative: nextAlternative,
  preview: preview,
  parseImport: parseImport,
  commitImport: commitImport

/* ==========================================================================
   chart.js — the small SVG charts on the Progress tab.

   No library. Everything here builds an <svg> string, drops it into a host
   element and wires one pointer handler for the readout.

   Charts are drawn at REAL PIXEL SIZE rather than scaled out of a fixed
   viewBox. A 640-wide viewBox squeezed onto a 360px phone would shrink the
   axis type to about six pixels, so instead we measure the host, draw to
   that width, and redraw on resize.

   Colour comes from CSS tokens via classes, never from hardcoded hex, so
   both themes are handled by style.css and nothing here needs to know which
   one is on.
   ========================================================================== */

window.IL = window.IL || {};

(function(IL){
"use strict";

var H = 190;                                  /* plot height, px            */
var PAD = { t:16, r:16, b:24, l:46 };

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;" }[c];
  });
}

/* --------------------------------------------------------------------------
   Scales
   -------------------------------------------------------------------------- */

/* A round number near span/count, so the axis only ever shows clean ticks —
   0 / 250 / 500, never 0 / 237 / 474. */
function niceStep(span, count){
  var raw = span / count;
  var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var norm = raw / mag;
  return (norm > 5 ? 10 : norm > 2 ? 5 : norm > 1 ? 2 : 1) * mag;
}

/* Bars must grow from zero or their length lies about the data. A trend line
   doesn't: forcing zero onto a 185 → 205 lift flattens the whole story into
   one row of pixels, so lines get a padded window around their own range. */
function axis(min, max, zero){
  if(zero) min = 0;

  if(max === min){
    var nudge = Math.abs(max) * 0.1 || 1;
    max += nudge;
    if(!zero) min -= nudge;
  }else if(!zero){
    var pad = (max - min) * 0.12;
    min -= pad;
    max += pad;
  }

  var step = niceStep(max - min, 4);
  var lo = zero ? 0 : Math.floor(min / step) * step;
  var hi = Math.ceil(max / step) * step;
  if(lo < 0 && min >= 0) lo = 0;               /* never invent negative load */
  if(hi <= lo) hi = lo + step;

  var ticks = [];
  for(var v = lo; v <= hi + step * 1e-6; v += step){
    ticks.push(Math.round(v * 1e6) / 1e6);
  }
  return { lo:lo, hi:hi, ticks:ticks };
}

/* --------------------------------------------------------------------------
   Drawing
   -------------------------------------------------------------------------- */

function gridHTML(a, Y, w){
  return a.ticks.map(function(v){
    var y = Y(v);
    return '<line class="c-grid" x1="' + PAD.l + '" x2="' + (w - PAD.r) +
             '" y1="' + y + '" y2="' + y + '"></line>' +
           '<text class="c-tick" x="' + (PAD.l - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' +
             esc(a.fmt(v)) + '</text>';
  }).join("");
}

/* First, middle and last only. A label under every point is unreadable at
   phone width, and the readout carries the rest. */
function xLabelsHTML(pts, X, cfg){
  var picks = pts.length > 2
    ? [0, Math.floor((pts.length - 1) / 2), pts.length - 1]
    : [0, pts.length - 1];
  var seen = {};

  return picks.map(function(i, n){
    if(seen[i]) return "";
    seen[i] = 1;
    var anchor = n === 0 ? "start" : (i === pts.length - 1 ? "end" : "middle");
    return '<text class="c-tick" x="' + X(pts[i], i).toFixed(1) + '" y="' + (H - 6) +
             '" text-anchor="' + anchor + '">' + esc(cfg.fmtX(pts[i].x)) + '</text>';
  }).join("");
}

function linePath(pts, X, Y){
  return pts.map(function(p, i){
    return (i ? "L" : "M") + X(p, i).toFixed(1) + " " + Y(p.y).toFixed(1);
  }).join(" ");
}

/* Square at the baseline, 4px rounded at the data end — the cap marks where
   the value stops without the whole mark turning into a lozenge. */
function barPath(x, y, w, bottom){
  var r = Math.min(4, w / 2, Math.max(0, bottom - y));
  return "M" + x + " " + bottom +
         "V" + (y + r) +
         "a" + r + " " + r + " 0 0 1 " + r + " " + (-r) +
         "h" + (w - r * 2) +
         "a" + r + " " + r + " 0 0 1 " + r + " " + r +
         "V" + bottom + "Z";
}

/* --------------------------------------------------------------------------
   draw(host, cfg)

     cfg.points   [{ x, y }]   x is a timestamp, y the value
     cfg.kind     "line" | "column"
     cfg.fmtY     axis tick     -> string
     cfg.fmtV     readout value -> string
     cfg.fmtX     timestamp     -> string
     cfg.empty    what to say when there isn't enough to plot
   -------------------------------------------------------------------------- */

function draw(host, cfg){
  if(!host) return;

  var pts = cfg.points || [];
  var need = cfg.kind === "column" ? 1 : 2;

  if(pts.length < need){
    host.innerHTML = '<p class="chart-empty">' + esc(cfg.empty || "Nothing to plot yet.") + '</p>';
    return;
  }

  var w = Math.max(260, Math.round(host.clientWidth || 320));
  var pw = w - PAD.l - PAD.r;
  var ph = H - PAD.t - PAD.b;

  var ys = pts.map(function(p){ return p.y; });
  var a = axis(Math.min.apply(null, ys), Math.max.apply(null, ys), cfg.kind === "column");
  a.fmt = cfg.fmtY;

  var Y = function(v){ return PAD.t + ph * (1 - (v - a.lo) / (a.hi - a.lo)); };

  var band = pw / pts.length;
  var thick = Math.max(3, Math.min(24, band - 2));   /* 2px gap between bars */
  var x0 = pts[0].x;
  var x1 = pts[pts.length - 1].x;

  var X = cfg.kind === "column"
    ? function(p, i){ return PAD.l + band * (i + 0.5); }
    : function(p){ return x1 === x0 ? PAD.l + pw / 2 : PAD.l + pw * (p.x - x0) / (x1 - x0); };

  var marks;

  if(cfg.kind === "column"){
    marks = pts.map(function(p, i){
      return '<path class="c-bar" data-hi="0" d="' +
        barPath((X(p, i) - thick / 2).toFixed(1), Y(p.y).toFixed(1), thick, Y(a.lo)) + '"></path>';
    }).join("");
  }else{
    var d = linePath(pts, X, Y);
    var base = Y(a.lo);
    var lastX = X(pts[pts.length - 1], pts.length - 1).toFixed(1);

    marks =
      '<path class="c-area" d="' + d + ' L' + lastX + ' ' + base +
        ' L' + X(pts[0], 0).toFixed(1) + ' ' + base + ' Z"></path>' +
      '<path class="c-line" d="' + d + '"></path>' +
      /* Intermediate dots only while they can still be told apart; past that
         they merge into a caterpillar and the bare line reads better. */
      (pts.length <= 12 ? pts.map(function(p, i){
        return '<circle class="c-dot" cx="' + X(p, i).toFixed(1) +
               '" cy="' + Y(p.y).toFixed(1) + '" r="4"></circle>';
      }).join("") : "") +
      '<circle class="c-dot end" cx="' + lastX +
        '" cy="' + Y(pts[pts.length - 1].y).toFixed(1) + '" r="4.5"></circle>';
  }

  var last = pts[pts.length - 1];

  host.innerHTML =
    '<div class="chart-read" data-read>' +
      '<b>' + esc(cfg.fmtV(last.y)) + '</b><span>' + esc(cfg.fmtX(last.x)) + '</span>' +
    '</div>' +
    '<svg class="chart" width="' + w + '" height="' + H + '" viewBox="0 0 ' + w + ' ' + H +
      '" role="img" aria-label="' + esc(cfg.label || "chart") + '">' +
      gridHTML(a, Y, w) +
      marks +
      xLabelsHTML(pts, X, cfg) +
      '<g class="c-cross" data-cross hidden>' +
        '<line y1="' + PAD.t + '" y2="' + (H - PAD.b) + '"></line>' +
        '<circle r="5.5"></circle>' +
      '</g>' +
      '<rect x="' + PAD.l + '" y="' + PAD.t + '" width="' + pw + '" height="' + ph +
        '" fill="transparent" data-hit></rect>' +
    '</svg>';

  wire(host, pts, X, Y, cfg, band);
}

/* One pointer handler covers mouse and touch. Tapping or dragging across the
   plot moves the crosshair and rewrites the readout above it; leaving snaps
   back to the most recent point. */
function wire(host, pts, X, Y, cfg, band){
  var svg = host.querySelector("svg");
  var cross = host.querySelector("[data-cross]");
  var line = cross.querySelector("line");
  var dot = cross.querySelector("circle");
  var read = host.querySelector("[data-read]");
  var bars = host.querySelectorAll(".c-bar");

  function paintRead(p){
    read.innerHTML = '<b>' + esc(cfg.fmtV(p.y)) + '</b><span>' + esc(cfg.fmtX(p.x)) + '</span>';
  }

  function highlight(index){
    for(var b = 0; b < bars.length; b++) bars[b].dataset.hi = (b === index) ? "1" : "0";
  }

  function show(i){
    var p = pts[i];
    var x = X(p, i);
    line.setAttribute("x1", x);
    line.setAttribute("x2", x);
    dot.setAttribute("cx", x);
    dot.setAttribute("cy", Y(p.y));
    cross.hidden = false;
    paintRead(p);
    highlight(i);
  }

  function reset(){
    cross.hidden = true;
    paintRead(pts[pts.length - 1]);
    highlight(-1);
  }

  function at(ev){
    var px = ev.clientX - svg.getBoundingClientRect().left;
    var best = 0;

    if(cfg.kind === "column"){
      best = Math.max(0, Math.min(pts.length - 1, Math.floor((px - PAD.l) / band)));
    }else{
      var nearest = Infinity;
      for(var i = 0; i < pts.length; i++){
        var gap = Math.abs(X(pts[i], i) - px);
        if(gap < nearest){ nearest = gap; best = i; }
      }
    }
    show(best);
  }

  svg.addEventListener("pointermove", at);
  svg.addEventListener("pointerdown", at);
  svg.addEventListener("pointerleave", reset);
}

IL.chart = { draw: draw, height: H };

})(window.IL);


/* ==========================================================================
   ui.js — everything that produces markup.

   Rendering is split two ways on purpose:
     renderTrain()      rebuilds the whole day; used for structural changes
                        (add, remove, reorder, set count, switching days)
     patchExercise(i)   swaps one row and updates the counter; used for the
