<title>Iron Ledger</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   Iron Ledger — industrial amber on cool graphite.
   Every colour is a token declared on :root first, then re-declared for the
   two dark cases, so nothing is left undefined in any theme state.
   ========================================================================== */

:root{
  /* surfaces */
  --ground:#EDEFEE;
  --surface:#FFFFFF;
  --surface-2:#E4E8E7;
  /* text */
  --ink:#14191A;
  --ink-2:#4C5759;
  --ink-3:#7C8A8B;
  /* rules */
  --line:#C9D1D0;
  --line-soft:#DCE1E0;
  /* accent — rack-pin amber */
  --accent:#A85F00;
  --accent-hi:#C87400;
  --accent-ink:#FFFFFF;
  --accent-soft:#F3E1C4;
  /* semantic, kept separate from the accent */
  --good:#1C7359;
  --danger:#A03A18;
  /* calories against target — a warm/cool DIRECTION pair, not good/bad:
     over is the aim on a bulk and the thing to avoid on a cut. Validated
     against this surface for colour-blind separation (ΔE 22) and contrast. */
  --over:#A85F00;
  --under:#2F6FB3;
  --under-soft:#DCE7F4;

  --shadow:0 1px 2px rgba(16,26,26,.10), 0 12px 28px -12px rgba(16,26,26,.28);
  --r:10px;

  --font-d:"Saira Condensed","Arial Narrow",Haettenschweiler,sans-serif;
  --font-b:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* System dark, unless the viewer explicitly asked for light. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1313;
    --surface:#171C1D;
    --surface-2:#212829;
    --ink:#E8EDEB;
    --ink-2:#A2AFAD;
    --ink-3:#6E7C7C;
    --line:#2B3334;
    --line-soft:#222A2B;
    --accent:#F0A73C;
    --accent-hi:#FFBB57;
    --accent-ink:#1A1205;
    --accent-soft:#382812;
    --good:#4FC3A1;
    --danger:#E1795A;
    --over:#C27A18;
    --under:#4F8ACB;
    --under-soft:#1C2A38;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 32px -14px rgba(0,0,0,.7);
  }
}

/* Explicit dark choice wins over a light OS. */
:root[data-theme="dark"]{
  --ground:#0F1313;
  --surface:#171C1D;
  --surface-2:#212829;
  --ink:#E8EDEB;
  --ink-2:#A2AFAD;
  --ink-3:#6E7C7C;
  --line:#2B3334;
  --line-soft:#222A2B;
  --accent:#F0A73C;
  --accent-hi:#FFBB57;
  --accent-ink:#1A1205;
  --accent-soft:#382812;
  --good:#4FC3A1;
  --danger:#E1795A;
  --over:#C27A18;
  --under:#4F8ACB;
  --under-soft:#1C2A38;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 32px -14px rgba(0,0,0,.7);
}


/* ==========================================================================
   Base
   ========================================================================== */

*{box-sizing:border-box}

/* Locked in for a phone.

   touch-action:manipulation is the line that stops a double tap zooming: it
   tells the browser this document has no double-tap gesture, so the second
   tap of a quick +5 +5 is another +5 and the 300ms wait-and-see disappears
   with it. Pinch-zoom is deliberately NOT disabled — it is the only way back
   for anyone who needs the text bigger, and nobody pinches by accident. */
html{
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

/* An author `display` beats the browser's own [hidden] rule, so anything
   given a display here — .actionbar, .sheet — would ignore `el.hidden`
   without this. It's the one !important in the file and it earns it. */
[hidden]{display:none !important}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-b);
  font-size:15px;
  line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}

button,input,textarea,select{font:inherit;color:inherit}

/* A fast second tap on a button used to start selecting its label and put
   the magnifier up. Buttons are for pressing; nothing in one needs copying. */
button{
  background:none;border:0;padding:0;cursor:pointer;color:inherit;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
img{max-width:100%}
h1,h2,h3{margin:0;font-family:var(--font-d);font-weight:600;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:4px}

/* Small uppercase caption, used above every form field. */
.lab{
  display:block;margin-bottom:6px;
  font-family:var(--font-m);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);
}

textarea,
input[type="text"],
input[type="number"]{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:11px 12px;
  color:var(--ink);
  /* Never below 16px. Safari zooms the page to meet any field smaller than
     that when it takes focus, and then leaves you scrolled sideways. */
  font-size:16px;
}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input[type="number"]{font-family:var(--font-m);font-variant-numeric:tabular-nums;text-align:center}

.app{
  max-width:560px;margin:0 auto;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  background:var(--ground);
}


/* ==========================================================================
   Top bar + rotation rail
   ========================================================================== */

.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:10px 14px 0;
  padding-top:max(10px,env(safe-area-inset-top));
}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{font-size:21px;letter-spacing:.055em;text-transform:uppercase;line-height:1}
.brand .cycle{
  font-family:var(--font-m);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}

.tb-actions{display:flex;gap:6px;flex:none}
.tb-btn{
  min-height:34px;padding:7px 11px;
  border:1px solid var(--line);border-radius:var(--r);
  font-family:var(--font-d);font-size:13px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
}
.tb-btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* The split itself is the navigation. Amber = where you are,
   teal = the day you logged most recently. */
.rail{display:grid;grid-template-columns:repeat(4,1fr);margin-top:9px}
.rail button{
  padding:9px 2px 10px;text-align:center;
  border-top:3px solid var(--line-soft);
  font-family:var(--font-d);font-size:13px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;line-height:1.15;
  color:var(--ink-3);
}
.rail button .n{
  display:block;margin-bottom:1px;
  font-family:var(--font-m);font-size:9.5px;font-weight:500;
  letter-spacing:.1em;opacity:.75;
}
.rail button[data-logged="1"]{color:var(--ink-2);border-top-color:var(--good)}
.rail button[aria-current="true"]{color:var(--ink);border-top-color:var(--accent)}


/* ==========================================================================
   Session header
   ========================================================================== */

main{flex:1;padding-bottom:8px}

.session-head{
  padding:16px 14px 12px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.session-head h2{font-size:29px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.session-head .sub{margin-top:5px;font-size:12.5px;color:var(--ink-2)}

.prog{flex:none;text-align:right}
.prog .big{
  font-family:var(--font-m);font-size:21px;font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums;
}
.prog .cap{
  margin-top:3px;
  font-family:var(--font-m);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);
}


/* ==========================================================================
   Exercise ledger — hairline rows, not a deck of cards
   ========================================================================== */

.ledger{border-top:1px solid var(--line);background:var(--surface)}

.ex{display:flex;border-bottom:1px solid var(--line-soft)}

/* Left stripe fills as sets are logged, then flips to the completion colour. */
.ex-stripe{flex:none;width:4px;background:var(--line-soft);position:relative}
.ex-stripe i{
  position:absolute;left:0;top:0;display:block;
  width:100%;height:var(--p,0%);
  background:var(--accent);transition:height .18s ease;
}
.ex[data-complete="1"] .ex-stripe i{background:var(--good)}

.ex-body{flex:1;min-width:0;padding:13px 14px 14px}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-head h3{flex:1;min-width:0;font-size:18.5px;letter-spacing:.015em;line-height:1.12}
.ex[data-complete="1"] .ex-head h3{color:var(--ink-2)}

.edit{
  flex:none;min-height:30px;padding:5px 8px;
  border:1px solid var(--line);border-radius:7px;
  font-family:var(--font-m);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}

.ex-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:7px}
.chip{
  padding:3px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);
  font-family:var(--font-m);font-size:11.5px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.chip.load{background:var(--accent-soft);color:var(--accent);font-weight:600}
.last{
  font-family:var(--font-m);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.ex-note{
  margin-top:8px;padding-left:9px;
  border-left:2px solid var(--line);
  font-size:12.5px;color:var(--ink-2);
}

.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin-top:11px}
.set{
  height:46px;
  border:1px solid var(--line);border-radius:8px;background:var(--ground);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--font-m);font-variant-numeric:tabular-nums;
  transition:background .12s,border-color .12s,transform .08s;
}
.set .s{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.set .r{font-size:14px;font-weight:600;color:var(--ink-2)}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.set[aria-pressed="true"] .s,
.set[aria-pressed="true"] .r{color:var(--accent-ink)}
.set:active{transform:scale(.97)}

.addrow{padding:14px}
.add-btn{
  width:100%;min-height:46px;
  border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2);
  font-family:var(--font-d);font-size:15px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
}

.notes{padding:4px 14px 18px}


/* ==========================================================================
   Sticky action bar
   ========================================================================== */

.actionbar{
  position:sticky;bottom:0;z-index:30;
  display:flex;align-items:stretch;gap:9px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
}

.timer{
  flex:none;min-width:92px;padding:0 10px;
  border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.timer .t{
  font-family:var(--font-m);font-size:19px;font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums;
}
.timer .l{
  font-family:var(--font-m);font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.timer[data-run="1"]{border-color:var(--accent);background:var(--accent-soft)}
.timer[data-run="1"] .t{color:var(--accent)}

.finish{
  flex:1;min-height:52px;padding:0 8px;
  border-radius:var(--r);background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-d);font-size:18px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;
}
.finish:active{background:var(--accent-hi)}
.finish[data-armed="1"]{background:var(--good);color:var(--ground);font-size:15px}


/* ==========================================================================
   Bottom sheet
   ========================================================================== */

.scrim{
  position:fixed;inset:0;z-index:40;
  background:rgba(8,14,14,.55);
  opacity:0;transition:opacity .2s;
}
.scrim.open{opacity:1}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:560px;margin:0 auto;max-height:88dvh;
  display:flex;flex-direction:column;
  background:var(--surface);
  border-top-left-radius:16px;border-top-right-radius:16px;
  box-shadow:var(--shadow);
  transform:translateY(100%);
  transition:transform .24s cubic-bezier(.2,.8,.3,1);
}
.sheet.open{transform:translateY(0)}

.sheet-head{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 16px 12px;border-bottom:1px solid var(--line);
}
.sheet-head::before{                      /* grab handle */
  content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:36px;height:4px;border-radius:2px;background:var(--line);
}
.sheet-head h3{flex:1;min-width:0;font-size:19px;letter-spacing:.05em;text-transform:uppercase}

.sheet-body{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:16px;
  padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));
}

.field{display:flex;flex-direction:column}

.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{
  flex:none;width:52px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--ground);
  font-family:var(--font-m);font-size:19px;font-weight:500;color:var(--ink-2);
}
.stepper button:active{background:var(--surface-2)}
.stepper input{flex:1;min-width:0;padding:12px 6px;font-size:19px;font-weight:600}

.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{
  flex:1;min-width:60px;min-height:38px;
  border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-m);font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}

.rowbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rowbtns button{
  min-height:46px;
  border:1px solid var(--line);border-radius:var(--r);color:var(--ink-2);
  font-family:var(--font-d);font-size:14px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;
}
.rowbtns button.danger{color:var(--danger);border-color:var(--danger)}

.swapname{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:12px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);
}
.swapname strong{font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.02em}
.swapname span{
  flex:none;font-family:var(--font-m);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}


/* ==========================================================================
   Exercise library picker
   ========================================================================== */

.lib-group{
  margin:14px 0 6px;padding-top:12px;
  border-top:1px solid var(--line-soft);
  font-family:var(--font-m);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.lib-group:first-of-type{margin-top:0;padding-top:0;border-top:0}

/* A row is the pick button plus, for your own exercises, a way into the
   editor. Two buttons rather than one, because a button inside a button is
   not a thing. */
.lib-row{display:flex;align-items:stretch;gap:8px;border-bottom:1px solid var(--line-soft)}
.lib-row:last-child{border-bottom:0}

.lib-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex:1;min-width:0;min-height:48px;padding:12px 2px;text-align:left;
}
.lib-row .lib-item{border-bottom:0}
.lib-item strong{min-width:0;overflow-wrap:anywhere}

.lib-item.solo{
  border:1px dashed var(--accent);border-radius:var(--r);
  margin-bottom:10px;padding:12px;
}
.lib-item.solo .d{color:var(--accent)}

.lib-edit{
  flex:none;align-self:center;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-m);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.lib-item strong{font-family:var(--font-d);font-size:17px;font-weight:500;letter-spacing:.01em;line-height:1.15}
.lib-item .d{
  flex:none;font-family:var(--font-m);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}


/* ==========================================================================
   Training log
   ========================================================================== */

.hist{display:flex;flex-direction:column;gap:12px;padding:16px 14px 20px}
.empty{padding:36px 20px;text-align:center;font-size:14px;color:var(--ink-3)}

.sess{
  background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r);
  overflow:hidden;
}
.sess-top{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;text-align:left}
.sess-tag{
  flex:none;padding:4px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);
  font-family:var(--font-d);font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
}
.sess-when{flex:1;min-width:0}
.sess-when b{
  display:block;text-transform:uppercase;
  font-family:var(--font-d);font-size:16px;font-weight:600;letter-spacing:.03em;
}
.sess-when small{
  font-family:var(--font-m);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.sess-vol{flex:none;text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.sess-vol b{display:block;font-size:15px;font-weight:600;line-height:1.1}
.sess-vol small{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}

.sess-detail{border-top:1px solid var(--line-soft);padding:4px 13px 12px}
.sess-line{
  display:flex;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;
}
.sess-line:last-of-type{border-bottom:0}
.sess-line span{
  flex:none;font-family:var(--font-m);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.sess-note{
  margin-top:10px;padding-left:9px;
  border-left:2px solid var(--accent);
  font-size:13px;color:var(--ink-2);
}
.sess-del{
  margin-top:12px;min-height:32px;
  font-family:var(--font-m);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--danger);
}


/* ==========================================================================
   Settings
   ========================================================================== */

.settings{
  margin-top:8px;padding-top:16px;
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:12px;
}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.setrow .k{font-size:14px}
.setrow .k small{display:block;font-size:11.5px;color:var(--ink-3)}
.setrow .edit.danger{color:var(--danger);border-color:var(--danger)}

.seg{flex:none;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{
  min-height:38px;padding:8px 12px;
  font-family:var(--font-m);font-size:12px;color:var(--ink-3);
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}


/* ==========================================================================
   Toast
   ========================================================================== */

.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,20px);
  max-width:calc(100% - 28px);padding:11px 16px;
  background:var(--ink);color:var(--ground);
  border-radius:var(--r);box-shadow:var(--shadow);
  font-size:13.5px;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}


@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}


/* ==========================================================================
   Set logger — one set, one or more weights
   ========================================================================== */

.sheet-sub{
  margin-top:-4px;
  font-family:var(--font-m);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);
}

.hint{margin-top:8px;font-size:12px;color:var(--ink-3);line-height:1.4}

/* Each weight in the set gets its own block. The top set is plain; drops
   are indented behind an amber rail so the hierarchy is visible at a glance. */
.segblock{
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
}
.segblock.is-drop{
  border-left:3px solid var(--accent);
  background:var(--ground);
}

.segblock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px}
.seglabel{
  font-family:var(--font-m);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.segdel{
  font-family:var(--font-m);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--danger);min-height:28px;padding:0 4px;
}

.seggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seggrid .lab{margin-bottom:5px}

/* Narrower stepper for the two-up grid. */
.stepper.mini button{width:40px;font-size:17px}
.stepper.mini input{padding:10px 2px;font-size:17px}

/* Rep chips derived from the exercise's own target. */
.quick.reps{margin-top:0}
.quick.reps button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
}

.settotal{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:12px 13px;border-radius:var(--r);
  background:var(--surface-2);
}
.settotal span{
  font-family:var(--font-m);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);
}
.settotal b{
  font-family:var(--font-m);font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;
}

.rowbtns.one{grid-template-columns:1fr}

/* Drop sets spelled out inside a logged session. */
.sess-drops{
  padding:0 0 8px 0;
  font-family:var(--font-m);font-size:11.5px;line-height:1.6;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}


/* ==========================================================================
   Three tabs on a phone

   Train / Log / Progress plus the wordmark won't fit across 360px, so the
   cycle badge steps aside there — the day's subtitle carries it instead.
   ========================================================================== */

@media (max-width:430px){
  .brand h1{font-size:18px}
  .brand .cycle{display:none}
  .tb-btn{padding:7px 8px;font-size:12px;letter-spacing:.055em}
}


/* ==========================================================================
   Dates and selects — same furniture as the text fields
   ========================================================================== */

input[type="date"],
select{
  width:100%;min-height:46px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:11px 12px;
  color:var(--ink);
  font-size:16px;      /* as above: under 16 and focusing it zooms iOS */
}
input[type="date"]{
  -webkit-appearance:none;appearance:none;
  font-family:var(--font-m);font-variant-numeric:tabular-nums;
}

.seg.wide{width:100%}
.seg.wide button{flex:1}

.rowbtns button.primary{
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
}


/* ==========================================================================
   Days off in the log
   ========================================================================== */

.sess.is-skip .sess-when b{color:var(--ink-2)}
.sess.is-skip .sess-vol b{font-family:var(--font-d);font-size:14px;color:var(--ink-3)}
.sess.is-skip .sess-tag{background:var(--surface-2);color:var(--ink-3)}
.sess[data-skip="missed"] .sess-tag{
  background:transparent;color:var(--danger);
  box-shadow:inset 0 0 0 1px var(--danger);
}

.sess-date{padding:10px 0 12px}
.sess-date .lab{margin-bottom:5px}


/* ==========================================================================
   Getting the data out
   ========================================================================== */

.set-title{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.datarow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.datarow .add-btn{font-size:13.5px}
.settings .hint{margin-top:0}


/* ==========================================================================
   Progress
   ========================================================================== */

.prog-wrap{display:flex;flex-direction:column;gap:12px;padding:16px 14px 24px}

/* Hairline-separated tiles rather than four floating cards: the 1px grid gap
   over a line-coloured backing is the rule between them. */
.stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.stat{background:var(--surface);padding:11px 12px}
.stat .k{
  display:block;
  font-family:var(--font-m);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.stat b{
  display:block;margin-top:2px;
  font-family:var(--font-d);font-size:23px;font-weight:600;
  letter-spacing:.02em;line-height:1.15;
}
.stat small{display:block;font-size:11px;line-height:1.35;color:var(--ink-3)}

.card{
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
  padding:13px 13px 15px;
}
.card h3{font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:10px;
}
.card > h3{margin-bottom:10px}
.card select{margin-bottom:4px}
.card .hint{margin-top:10px}


/* ==========================================================================
   Charts

   Every colour here is a token, so the SVG follows the theme without any
   JavaScript knowing which theme is on.
   ========================================================================== */

.chart-host{margin-top:4px}
.chart{display:block;width:100%;touch-action:pan-y}

.chart-read{display:flex;align-items:baseline;gap:9px;min-height:28px;flex-wrap:wrap}
.chart-read b{
  font-family:var(--font-d);font-size:23px;font-weight:600;letter-spacing:.02em;
  line-height:1.1;
}
.chart-read span{
  font-family:var(--font-m);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);
}
/* The one hero figure on the view — the number the whole tab is about. */
.chart-host.hero .chart-read b{font-size:clamp(30px,9vw,44px)}

.chart-empty{
  padding:28px 6px;font-size:13px;line-height:1.5;color:var(--ink-3);
}

.c-grid{stroke:var(--line-soft);stroke-width:1}
.c-tick{
  fill:var(--ink-3);
  font-family:var(--font-m);font-size:10px;font-variant-numeric:tabular-nums;
}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent);fill-opacity:.10;stroke:none}
.c-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-bar{fill:var(--accent);fill-opacity:.8}
.c-bar[data-hi="1"]{fill-opacity:1}
.c-cross line{stroke:var(--ink-3);stroke-width:1}
.c-cross circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}


/* ==========================================================================
   Consistency grid — a column per week, a row per weekday
   ========================================================================== */

.cal{display:flex;gap:5px;align-items:stretch}
.cal-head{
  display:grid;grid-template-rows:repeat(7,1fr);gap:4px;flex:none;
}
.cal-h{
  display:flex;align-items:center;
  font-family:var(--font-m);font-size:9px;color:var(--ink-3);
}
.cal-grid{
  flex:1;min-width:0;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  grid-template-rows:repeat(7,1fr);gap:4px;
}

.cal-c{
  display:block;aspect-ratio:1;border-radius:3px;
  background:var(--line-soft);border:1px solid transparent;
}
.cal-c[data-state="trained"]{background:var(--accent)}
.cal-c[data-state="trained"][data-level="1"]{opacity:.4}
.cal-c[data-state="trained"][data-level="2"]{opacity:.7}
.cal-c[data-state="trained"][data-level="3"]{opacity:1}
/* Both "you didn't train" states are rings rather than fills, so neither can
   be mistaken for a trained day at a glance, and they match each other in
   weight — grey for one you meant to take, red for one you didn't. */
.cal-c[data-state="rest"]{background:var(--surface-2);border-color:var(--ink-3);border-width:1.5px}
.cal-c[data-state="missed"]{background:transparent;border-color:var(--danger);border-width:1.5px}

.cal-key{
  display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;
  font-size:11.5px;color:var(--ink-2);
}
.cal-key span{display:flex;align-items:center;gap:6px}
.cal-key .cal-c{width:11px;height:11px;aspect-ratio:auto;flex:none}


/* ==========================================================================
   Weigh-in sheet
   ========================================================================== */

.bwlist{display:flex;flex-direction:column}
.bwrow{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
.bwrow:last-child{border-bottom:0}
.bwrow span{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.bwrow b{
  font-family:var(--font-m);font-size:13.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
}


/* ==========================================================================
   What the last session changed

   Four states, and never colour alone: each carries its own word. Amber for
   a load that went up, teal for one deliberately backed off, plain ink for
   a hold, and an accent rule down the side for a slot that changed hands.
   ========================================================================== */

.planbar{
  display:flex;align-items:baseline;gap:10px;
  margin:0 14px 12px;padding:9px 12px;
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r);background:var(--surface);
}
.planbar .k{
  flex:none;font-family:var(--font-m);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.planbar b{font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:.03em}

.ex-plan{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px;
  margin-top:9px;padding-left:9px;
  border-left:2px solid var(--line);
  font-size:12px;line-height:1.4;
}
.ex-plan b{
  font-family:var(--font-m);font-size:11.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.ex-plan span{color:var(--ink-3)}

.ex-plan[data-kind="up"]{border-left-color:var(--accent)}
.ex-plan[data-kind="up"] b{color:var(--accent)}
.ex-plan[data-kind="down"]{border-left-color:var(--good)}
.ex-plan[data-kind="down"] b{color:var(--good)}
.ex-plan[data-kind="swap"]{border-left-color:var(--accent);background:var(--accent-soft);
  padding:7px 9px;border-radius:0 6px 6px 0}
.ex-plan[data-kind="swap"] b{color:var(--accent)}
.ex-plan[data-kind="hold"] b,
.ex-plan[data-kind="open"] b{color:var(--ink-2)}


/* ==========================================================================
   Settings rows that need the full width for their control
   ========================================================================== */

.setrow.stack{
  display:block;
  padding:4px 0 2px;
}
.setrow.stack .k{margin-bottom:8px}
.setrow.stack .k small{margin-top:2px}

.rowbtns.two{grid-template-columns:1fr 1fr}


/* ==========================================================================
   Importing past training
   ========================================================================== */

textarea.tall{
  min-height:190px;
  /* 16px like every other field: anything smaller and Safari zooms the page
     to meet it the moment it takes focus. */
  font-family:var(--font-m);font-size:16px;line-height:1.5;
  font-variant-numeric:tabular-nums;
  /* Keep the line breaks that separate one day from the next, but let a long
     exercise line wrap. A sideways scrollbar inside a sheet that already
     scrolls down is a fight on a touchscreen. */
  white-space:pre-wrap;overflow-wrap:break-word;
}

/* The format guide. Closed by default — it is reference, not instruction,
   and the placeholder in the box above already shows the shape. */
.fmt{
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);
}
.fmt summary{
  padding:12px 13px;cursor:pointer;
  font-family:var(--font-d);font-size:14px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
}
.fmt ul{margin:0;padding:0 14px 4px 30px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.fmt li{margin-bottom:4px}
.fmt li b{font-weight:600;color:var(--ink)}
.fmt .hint{padding:0 14px 13px}
.fmt code{
  font-family:var(--font-m);font-size:11.5px;
  padding:1px 5px;border-radius:4px;
  background:var(--surface-2);color:var(--ink);
}

.impview{display:flex;flex-direction:column;gap:8px}

.improw{
  display:flex;align-items:baseline;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--line-soft);
}
.improw:last-child{border-bottom:0}
.improw span{
  flex:none;width:74px;
  font-family:var(--font-m);font-size:11px;color:var(--ink-3);
}
.improw b{flex:1;min-width:0;font-family:var(--font-d);font-size:14px;font-weight:600}
.improw small{flex:none;font-size:11px;color:var(--ink-3)}

/* Lines the parser could not read. Stated plainly rather than hidden — an
   import you cannot check is one you cannot trust. */
.impwarn{
  padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--danger);
  font-size:12.5px;line-height:1.45;color:var(--danger);
}

.rowbtns button[disabled]{opacity:.45}


/* ==========================================================================
   Snapshots and the export nudge
   ========================================================================== */

/* Said once, plainly, and only when it is actually true. A permanent banner
   is one you stop seeing. */
.nudge{
  margin-top:8px;padding:10px 12px;
  border:1px solid var(--accent);border-radius:var(--r);
  background:var(--accent-soft);
  font-size:12.5px;line-height:1.45;color:var(--accent);
}
.hint.good{color:var(--good)}

.snaprow{
  display:flex;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
.snaprow:last-child{border-bottom:0}
.snapwhen{flex:1;min-width:0}
.snapwhen b{
  display:block;font-family:var(--font-d);font-size:14px;font-weight:600;
  letter-spacing:.02em;overflow-wrap:anywhere;
}
.snapwhen small{
  display:block;font-family:var(--font-m);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.snapgo{
  flex:none;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-m);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);
}


/* ==========================================================================
   Nutrition

   Over and under are a direction, not a verdict, so the colour only ever
   sits on a mark — a bar, a meter segment, a swatch. The numbers and words
   beside them stay in ink.
   ========================================================================== */

/* Today, against the target. */
.food-today{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  margin-top:12px;
}
.food-num b{
  display:block;
  font-family:var(--font-d);font-size:34px;font-weight:600;
  letter-spacing:.02em;line-height:1;
}
.food-num span{
  display:block;margin-top:4px;
  font-family:var(--font-m);font-size:11px;color:var(--ink-3);
}
.food-diff{
  display:flex;align-items:center;gap:6px;flex:none;
  font-family:var(--font-m);font-size:12.5px;font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.food-none{margin-top:10px}

/* The meter. The track is a lighter step of the under hue so the whole bar
   reads as one scale; the part past the target is the over hue, set off
   from the rest by a 2px gap and a tick in ink at the target itself. */
.meter{
  position:relative;height:10px;margin-top:10px;
  border-radius:5px;background:var(--under-soft);overflow:hidden;
}
.meter i{position:absolute;top:0;bottom:0;left:0;display:block}
.meter-in{background:var(--under);border-radius:5px 0 0 5px}
.meter-over{background:var(--over);border-left:2px solid var(--surface)}
.meter-mark{width:2px;margin-left:-1px;background:var(--ink)}

.food-macros{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:12px;
}
.macro .lab{margin-bottom:2px}
.macro b{
  font-family:var(--font-m);font-size:15px;font-weight:600;
}
.macro i{font-style:normal;font-size:13px;color:var(--ink-3)}

/* The target, and the way to change it. */
.food-goal{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
}
.food-goal .k{min-width:0}
.food-goal .lab{margin-bottom:2px}
.food-goal b{font-family:var(--font-m);font-size:15px;font-weight:600}
.food-goal small{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.food-goal .edit{flex:none}

/* A phase is a label, not a state — plain ink, outlined. */
.phase{
  display:inline-block;margin-left:7px;padding:1px 6px;vertical-align:2px;
  border:1px solid var(--line);border-radius:5px;
  font-family:var(--font-m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);
}

/* Swatches carry the colour so the text beside them doesn't have to. */
.sw{
  display:inline-block;flex:none;width:9px;height:9px;border-radius:2px;
  vertical-align:0;
}
.sw[data-dir="over"]{background:var(--over)}
.sw[data-dir="under"]{background:var(--under)}

.chart-key{
  display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;
  font-family:var(--font-m);font-size:10.5px;color:var(--ink-3);
}
.chart-key span{display:flex;align-items:center;gap:6px}

/* The chart marks. The zero line is the target, so it's one step stronger
   than the grid — present, but still recessive next to the bars. */
.c-bar[data-dir="over"]{fill:var(--over)}
.c-bar[data-dir="under"]{fill:var(--under)}
.c-zero{stroke:var(--ink-3);stroke-width:1}

/* Averages, each with how many days it stands on. */
.food-avg{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;
  background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.food-avg-tile{background:var(--surface);padding:9px 10px;min-width:0}
.food-avg-tile .lab{margin-bottom:2px}
.food-avg-tile b{
  display:block;
  font-family:var(--font-d);font-size:20px;font-weight:600;line-height:1.15;
}
.food-avg-tile b.none{color:var(--ink-3)}
.food-avg-tile small{display:block;font-size:10.5px;line-height:1.35;color:var(--ink-3)}
.food-avg-head{margin:14px 0 6px}
.food-avg{margin-top:0}
#foodMore{margin-top:10px;min-height:40px;font-size:13px}

/* The table view: every logged day, exact numbers, one tap to edit. */
.food-list{margin-top:14px}
.food-list > .lab{margin-bottom:4px}
.food-row{
  display:grid;grid-template-columns:1fr auto 64px;
  grid-template-areas:"d n x" "m m m";
  align-items:baseline;column-gap:10px;
  width:100%;padding:9px 0;text-align:left;
  border-bottom:1px solid var(--line-soft);
}
.food-row:last-child{border-bottom:0}
.food-row .d{grid-area:d;font-size:13px;color:var(--ink-2)}
.food-row b{
  grid-area:n;text-align:right;
  font-family:var(--font-m);font-size:13.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.food-row .diff{
  grid-area:x;display:flex;align-items:center;justify-content:flex-end;gap:5px;
  font-family:var(--font-m);font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.food-row small{
  grid-area:m;font-family:var(--font-m);font-size:10.5px;color:var(--ink-3);
}
.food-row small:empty{display:none}


/* ==========================================================================
   Weight trend and maintenance
   ========================================================================== */

/* The readings under the average line: context, not signal. Muted ink at
   low opacity, so the eye goes to the line and the scatter shows the noise. */
.c-raw{fill:var(--ink-3);fill-opacity:.45}

.sw.line{width:14px;height:2px;border-radius:1px;background:var(--accent)}
.sw.raw{width:7px;height:7px;border-radius:50%;background:var(--ink-3);opacity:.7}

/* "estimated", beside the card title — a label, so plain ink, outlined. */
.tag{
  padding:2px 7px;
  border:1px solid var(--line);border-radius:5px;
  font-family:var(--font-m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}

.tdee{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  margin-top:12px;
}
.tdee-num b{
  display:block;
  font-family:var(--font-d);font-size:34px;font-weight:600;
  letter-spacing:.02em;line-height:1;
}
.tdee-num b.none{color:var(--ink-3)}
.tdee-num span{
  display:block;margin-top:4px;
  font-family:var(--font-m);font-size:11px;color:var(--ink-3);
}
.tdee-band{
  flex:none;
  font-family:var(--font-m);font-size:13px;font-weight:600;color:var(--ink-2);
}
.tdee-why,
.tdee-goal{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.tdee-goal{margin-top:6px}
.tdee-why b,
.tdee-goal b{font-weight:600;color:var(--ink)}
.tdee-need{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.6;color:var(--ink-2)}

/* Suggested targets in the target sheet. */
.suggest{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.suggest button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 4px;
  border:1px solid var(--line);border-radius:var(--r);
}
.suggest span{
  font-family:var(--font-d);font-size:13px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
}

     snapshots    a rolling set of whole-state copies in IndexedDB, taken

   still the export button, and eventually the sync.

   nothing to IndexedDB and would not have fit in localStorage. */
var KEEP = 20;

var dbPromise = null;
var broken = false;

function open(){
  if(broken) return Promise.reject(new Error("unavailable"));
  if(dbPromise) return dbPromise;

  dbPromise = new Promise(function(resolve, reject){
    if(!window.indexedDB){
      reject(new Error("no indexedDB"));
      return;

    var req;
    try{
      req = indexedDB.open(DB_NAME, VERSION);
    }catch(err){
      reject(err);            /* file:// in some browsers throws right here */
      return;

    req.onupgradeneeded = function(){
      var db = req.result;

    req.onerror = function(){ reject(req.error || new Error("open failed")); };

       rather than re-prompting a browser that has already said no. */
    broken = true;
    dbPromise = null;

   the promise settles on the transaction, not the request, so the write is
   actually durable by the time it resolves. */

  return open().then(function(db){
    return new Promise(function(resolve, reject){

        t.oncomplete = function(){ resolve(out); };

      entries: (s.history || []).length,
      weighIns: (s.body || []).length,

/* ==========================================================================
   store.js — state, persistence, and the domain questions asked of it.

   The whole app is one plain object saved to localStorage on every change.
   Shape:

     {
       schema:  storage version, so old saves can be migrated
       day:     0-3, index into days
       cycle:   how many times the rotation has come round
       days:    [ { id, name, tag, notes, ex: [ exercise ] } x4 ]
       history: [ session | skip ]        always sorted oldest → newest
       body:    [ { at, w } ]             bodyweight log, one entry per day
       custom:  [ libEntry ]              exercises you added on the phone
       nutrition: { days:{ "YYYY-MM-DD": food }, goals:[ goal ] }
       prefs:   { unit, step, autoRest, restCompound, restOther,
                  autoProgress, variety, lastExport }
     }

     food = { kcal, protein, fiber }      each a number or null (not logged)
     goal = { from:"YYYY-MM-DD", kcal, phase:"cut"|"maintain"|"bulk"|"" }

     exercise = { uid, name, sets, reps, weight, note, log,
                  pin, rotAge, progress }
     libEntry = { name, group, type, sets, reps, pattern, bw }

   A SET IS NOT A CHECKBOX. log[k] is either null (not done yet) or an array
   of segments — [{ w, r }, ...] — because one set can be several weights.
   Grinding 5 at 185, stripping down and getting 3 more at 155 is still one
   set, and it's stored as [{w:185,r:5},{w:155,r:3}].

     session = { id, at, kind:"session", dayId, dayName, notes, unit,
                 volume, entries }
     entry   = { name, sets, target, completed, topWeight, volume,
                 logged: [ { set, segs } ] }
     skip    = { id, at, kind:"skip", skipType:"missed"|"rest", dayId,
                 dayName, notes, unit, volume:0, entries:[] }

   HISTORY IS KEYED BY id, NOT BY POSITION. `at` is editable and skips can be
   backdated, so the array is re-sorted after any date change — an index held
   across that would point at the wrong day.
   ========================================================================== */

var MAX_SETS = 10;

function uid(prefix){
  uidCounter++;
  return (prefix || "e") + Date.now().toString(36) + uidCounter.toString(36);

/* --------------------------------------------------------------------------
   Dates

   Everything is stored as a timestamp, but the app reasons in local days: a
   session belongs to the calendar day you trained, not to a UTC instant.
   dayKey() is that day's identity and is what the date <input> speaks.
   -------------------------------------------------------------------------- */

function dayKey(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" +
         ("0" + (d.getMonth() + 1)).slice(-2) + "-" +
         ("0" + d.getDate()).slice(-2);
}

/* "2026-09-08" → a timestamp at that local midnight. Parsing the string with
   new Date() would read it as UTC and land on the day before for anyone west
   of Greenwich, so the parts are handed to the constructor directly. */
function fromDayKey(key, keepTimeFrom){
  var bits = String(key).split("-");
  var d = new Date(
    parseInt(bits[0], 10),
    parseInt(bits[1], 10) - 1,
    parseInt(bits[2], 10)
  );
  if(keepTimeFrom){
    var old = new Date(keepTimeFrom);
    d.setHours(old.getHours(), old.getMinutes(), 0, 0);
  }else{
    d.setHours(12, 0, 0, 0);      /* midday: immune to DST edges */
  }
  return d.getTime();
}

function startOfDay(ts){
  var d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

var DAY_MS = 86400000;

function daysBetween(a, b){
  return Math.round((startOfDay(b) - startOfDay(a)) / DAY_MS);
}

/* --------------------------------------------------------------------------
   Reading a rep target
   -------------------------------------------------------------------------- */

/* Top of a "6-8" style target. Quick-logging a set assumes you hit this. */
function repTop(reps){
  var found = String(reps).match(/\d+/g);
  return found ? parseInt(found[found.length - 1], 10) : 8;
}

/* Bottom of a "6-8" style target — the number a set has to clear to count
   as on-plan. Progression reads both ends. */
function repBottom(reps){
  var found = String(reps).match(/\d+/g);
  return found ? parseInt(found[0], 10) : 8;
}

/* Every whole number in the target, for the one-tap rep chips. */
function repChoices(reps){
  var found = String(reps).match(/\d+/g);
  if(!found) return [];
  var low = parseInt(found[0], 10);
  var high = parseInt(found[found.length - 1], 10);
  if(high < low) high = low;
  if(high - low > 7) return [low, high];        /* silly-wide target, just ends */
  var out = [];
  for(var n = low; n <= high; n++) out.push(n);
  return out;
}

/* --------------------------------------------------------------------------
   Segments
   -------------------------------------------------------------------------- */

function totalReps(segs){
  if(!segs) return 0;
  return segs.reduce(function(n, s){ return n + (s.r || 0); }, 0);
}

function segmentVolume(segs){
  if(!segs) return 0;
  return segs.reduce(function(n, s){ return n + (s.w || 0) * (s.r || 0); }, 0);
}

/* Heaviest weight in a set — what the set is "at", ignoring the drops. */
function topWeight(segs){
  if(!segs || !segs.length) return 0;
  return segs.reduce(function(m, s){ return Math.max(m, s.w || 0); }, 0);
}

function isLogged(e, k){ return !!(e.log && e.log[k] && e.log[k].length); }

/* --------------------------------------------------------------------------
   The exercise library

   Two sources, one list: the built-in library in data.js and whatever you
   have added from the phone, which lives in the save file. A custom entry
   with a built-in's name REPLACES it rather than sitting alongside, so
   re-adding "Calf Raise" with a different rep target is how you correct one.
   -------------------------------------------------------------------------- */

/* Guarded because seed() runs while state is still being built — the very
   first plan is laid out before there is a save file to read from. */
function customLib(){ return (state && state.custom) || []; }

function libLookup(name){
  var mine = customLib();
  for(var i = 0; i < mine.length; i++){
    if(mine[i].name === name) return mine[i];
  }
  return data.LIB_BY_NAME[name] ||
         Object.assign({ name:name }, data.CUSTOM_DEFAULTS);
}

function libAll(){
  var out = data.LIB.map(function(r){ return data.LIB_BY_NAME[r[1]]; });
  var at = {};
  out.forEach(function(x, i){ at[x.name] = i; });

  customLib().forEach(function(c){
    if(at[c.name] === undefined) out.push(c);
    else out[at[c.name]] = c;
  });
  return out;
}

function isCustom(name){
  return customLib().some(function(c){ return c.name === name; });
}

/* Punctuation-blind key, so "Hack-Squat machine" and "hack squat machine"
   are the same string to compare. */
function normName(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

/* Loosely typed name -> the canonical one, or "" when it's genuinely new.
   An exact match wins; failing that a partial only counts when exactly one
   exercise matches, because silently turning "squat" into "Split Squat"
   would put the wrong numbers in the log. */
function libResolve(name){
  var want = normName(name);
  if(!want) return "";

  var all = libAll();
  var i;
  for(i = 0; i < all.length; i++){
    if(normName(all[i].name) === want) return all[i].name;
  }

  var hits = all.filter(function(x){
    var n = normName(x.name);
    return n.indexOf(want) >= 0 || want.indexOf(n) >= 0;
  });
  return hits.length === 1 ? hits[0].name : "";
}

function addCustomExercise(spec){
  var name = String(spec.name || "").trim().replace(/\s+/g, " ");
  if(!name) return null;

  var d = data.CUSTOM_DEFAULTS;
  var entry = {
    name: name,
    group: String(spec.group || d.group).trim() || d.group,
    type: /^(compound|support|small)$/.test(spec.type) ? spec.type : d.type,
    sets: clampSets(spec.sets || d.sets),
    reps: String(spec.reps || d.reps).trim() || d.reps,
    pattern: data.PATTERN_LABEL[spec.pattern] ? spec.pattern : "",
    bw: !!spec.bw
  };

  state.custom = customLib().filter(function(c){ return c.name !== name; });
  state.custom.push(entry);
  state.custom.sort(function(a, b){ return a.name.localeCompare(b.name); });
  save();
  return entry;
}

/* Only ever forgets the library entry. Sessions already logged against the
   name keep it, and so does any day still using it — removing the entry
   just stops it being offered. */
function removeCustomExercise(name){
  var mine = customLib();
  var kept = mine.filter(function(c){ return c.name !== name; });
  if(kept.length === mine.length) return false;
  state.custom = kept;
  save();
  return true;
}

/* Everything that could do this exercise's job: same movement pattern, same
   weight class. A blank pattern gives a pool of one, which is how you hold
   an exercise still — the app has not been told what it could stand in for. */
function poolFor(name){
  var me = libLookup(name);
  if(!me.pattern) return [name];

  return libAll().filter(function(x){
    return x.pattern === me.pattern && x.type === me.type;
  }).map(function(x){ return x.name; });
}

function patternOf(name){ return libLookup(name).pattern || ""; }

function varietyRules(){
  return data.VARIETY[state.prefs.variety] || data.VARIETY.medium;
}

/* --------------------------------------------------------------------------
   Seeding, loading, migrating
   -------------------------------------------------------------------------- */

/* One exercise as it sits in a day's plan.

   pin       keeps auto-rotation off this slot
   rotAge    visits to this day since the slot last changed hands
   progress  what the last finish decided — the chip on the row */
function planned(name, sets, reps){
  var def = libLookup(name);
  return {
    uid: uid(),
    name: name,
    sets: clampSets(sets || def.sets),
    reps: String(reps || def.reps),
    weight: 0,
    note: "",
    log: [],
    pin: false,
    rotAge: 0,
    progress: null
  };
}

function seed(){
  return {
    schema: SCHEMA,
    day: 0,
    cycle: 1,
    days: data.TEMPLATES.map(function(t){
      return {
        id: t.id,
        name: t.name,
        tag: t.tag,
        notes: "",
        ex: t.plan.map(function(p){
          return planned(p[0], p[1], p[2]);
        })
      };
    }),
    history: [],
    body: [],
    custom: [],
    nutrition: { days:{}, goals:[] },
    prefs: {
      unit:"lb", step:5, autoRest:true, restCompound:180, restOther:90,
      autoProgress:true, variety:"medium",
      lastExport:0
    }
  };
}

/* schema 1 stored done:[bool]. Rebuild each ticked set as a single segment at
   whatever the working weight and rep target were, so nothing is lost. */
function migrateToV2(saved){
  saved.days.forEach(function(d){
    d.ex.forEach(function(e){
      if(e.log) return;
      var done = e.done || [];
      e.log = [];
      for(var k = 0; k < e.sets; k++){
        e.log[k] = done[k] ? [{ w:(e.weight || 0), r:repTop(e.reps) }] : null;
      }
      delete e.done;
    });
  });

  (saved.history || []).forEach(function(h){
    h.entries.forEach(function(en){
      if(en.logged) return;
      var segs = [];
      for(var k = 0; k < (en.completed || 0); k++){
        segs.push({ set:k + 1, segs:[{ w:(en.weight || 0), r:repTop(en.reps) }] });
      }
      en.logged = segs;
      en.target = en.reps;
      en.topWeight = en.weight || 0;
      en.volume = segs.reduce(function(n, s){ return n + segmentVolume(s.segs); }, 0);
      delete en.weight;
      delete en.reps;
    });
    h.volume = h.entries.reduce(function(n, en){ return n + (en.volume || 0); }, 0);
  });

  saved.schema = 2;
  return saved;
}

/* schema 2 had no ids, no skipped days and no bodyweight log. Everything it
   did have was a real session, so that's what it becomes. */
function migrateToV3(saved){
  saved.body = saved.body || [];
  (saved.history || []).forEach(function(h){
    if(!h.id) h.id = uid("h");
    if(!h.kind) h.kind = "session";
  });
  saved.schema = 3;
  return saved;
}

/* schema 3 knew nothing about custom exercises or auto-progression, so the
   plan it saved has never been advanced. Every new field has a sensible
   default and the first finished session takes it from there. */
function migrateToV4(saved){
  saved.custom = saved.custom || [];
  saved.schema = 4;
  return saved;
}

/* schema 4 had no nutrition log. Nothing to convert — it starts empty. */
function migrateToV5(saved){
  saved.nutrition = saved.nutrition || { days:{}, goals:[] };
  saved.schema = 5;
  return saved;
}

/* Bring any accepted save up to the current shape. Shared by load() and by
   restoring a backup file, so a backup can never sneak past a migration. */
function normalize(saved){
  saved.prefs = Object.assign(seed().prefs, saved.prefs || {});
  saved.history = saved.history || [];
  saved.body = saved.body || [];
  saved.custom = Array.isArray(saved.custom) ? saved.custom : [];
  saved.cycle = saved.cycle || 1;
  saved.day = saved.day || 0;
  saved.days.forEach(function(d){ d.notes = d.notes || ""; });

  if(!saved.schema || saved.schema < 2) migrateToV2(saved);
  if(saved.schema < 3) migrateToV3(saved);
  if(saved.schema < 4) migrateToV4(saved);
  if(saved.schema < 5) migrateToV5(saved);

  /* Whatever arrived, leave nutrition in exactly one shape: days as a map,
     goals as a list in date order. A hand-edited backup can't break it. */
  var food = saved.nutrition || {};
  saved.nutrition = {
    days: (food.days && typeof food.days === "object" && !Array.isArray(food.days))

    goals: Array.isArray(food.goals) ? food.goals : []
  };
  saved.nutrition.goals.sort(function(a, b){ return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });

  saved.days.forEach(function(d){
    d.ex.forEach(function(e){
      if(!Array.isArray(e.log)) e.log = [];
      if(typeof e.pin !== "boolean") e.pin = false;
      if(typeof e.rotAge !== "number") e.rotAge = 0;
      if(e.progress === undefined) e.progress = null;
    });

  saved.body.sort(function(a, b){ return a.at - b.at; });

function looksLikeSave(o){
  return !!(o && o.days && o.days.length === 4 && Array.isArray(o.days[0].ex));

function load(){
