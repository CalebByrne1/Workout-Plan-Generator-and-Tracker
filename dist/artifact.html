    var raw = localStorage.getItem(KEY);
    if(raw){
      var saved = JSON.parse(raw);
      if(looksLikeSave(saved)) return normalize(saved);
    }
  }catch(err){
    /* Unreadable or blocked storage — fall through to the stock plan. */
  }
  return seed();
}

var state = load();

/* onSaveError is set by app.js so a failed write can surface in the UI. */
var onSaveError = null;

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
  }catch(err){
    if(onSaveError) onSaveError();
  }
}

function reset(){
  state = seed();
  save();
  return state;
}

/* --------------------------------------------------------------------------
   Questions asked about the state
   -------------------------------------------------------------------------- */

function currentDay(){ return state.days[state.day]; }

function typeOf(name){
  return libLookup(name).type || data.CUSTOM_DEFAULTS.type;
}

function isBodyweight(name){
  return !!(data.BODYWEIGHT[name] || libLookup(name).bw);
}

function restFor(name){
  return typeOf(name) === "compound" ? state.prefs.restCompound : state.prefs.restOther;
}

function doneCount(e){
  var n = 0;
  for(var k = 0; k < e.sets; k++){ if(isLogged(e, k)) n++; }
  return n;
}

function dayProgress(day){
  var total = 0, done = 0;
  day.ex.forEach(function(e){ total += e.sets; done += doneCount(e); });
  return { done:done, total:total };
}

function exerciseVolume(e){
  var v = 0;
  for(var k = 0; k < e.sets; k++){ v += segmentVolume(e.log[k]); }
  return v;
}

/* Most recent logged performance per movement, for the "last ..." line.
   Walks history newest-first and keeps the first hit for each name. */
function lastPerformed(){
  var map = {};
  for(var i = state.history.length - 1; i >= 0; i--){
    var h = state.history[i];
    for(var j = 0; j < h.entries.length; j++){
      var en = h.entries[j];
      if(!map[en.name] && en.completed > 0){
        map[en.name] = {
          topWeight: en.topWeight || 0,
          logged: en.logged || [],
          unit: h.unit || "lb"
        };
      }
    }
  }
  return map;
}

/* The most recent session in which a movement was actually worked, handed
   over whole — sets planned, target, every rep of every set. This is what
   the progression rules read to decide the next load. */
function lastEntryFor(name){
  for(var i = state.history.length - 1; i >= 0; i--){
    var h = state.history[i];
    if(isSkip(h)) continue;
    for(var j = 0; j < h.entries.length; j++){
      if(h.entries[j].name === name && h.entries[j].completed > 0){
        return { at:h.at, unit:h.unit || "lb", entry:h.entries[j] };
      }
    }
  }
  return null;
}

/* --------------------------------------------------------------------------
   History — sessions and skipped days
   -------------------------------------------------------------------------- */

function isSkip(h){ return h.kind === "skip"; }

function sessionsOnly(){
  return state.history.filter(function(h){ return !isSkip(h); });
}

/* Which calendar days have a logged workout on them. */
function trainedDays(){
  var set = {};
  sessionsOnly().forEach(function(h){ set[dayKey(h.at)] = true; });
  return set;
}

/* A day you trained is not a day off, whatever else was recorded against it —
   mark a miss and then train after all, and the miss stops counting. The
   calendar and the counts both defer to this so they can't disagree. */
function skipsOnly(){
  var trained = trainedDays();
  return state.history.filter(function(h){
    return isSkip(h) && !trained[dayKey(h.at)];
  });
}

function sortHistory(){
  state.history.sort(function(a, b){ return a.at - b.at; });
}

function findEntry(id){
  for(var i = 0; i < state.history.length; i++){
    if(state.history[i].id === id) return state.history[i];
  }
  return null;
}

function removeEntry(id){
  for(var i = 0; i < state.history.length; i++){
    if(state.history[i].id === id){
      state.history.splice(i, 1);
      save();
      return true;
    }
  }
  return false;
}

/* Move a logged day to a different date, keeping the time of day it was
   finished at — the date is the part you'd want to correct, not the clock. */
function setEntryDate(id, key){
  var h = findEntry(id);
  if(!h) return false;
  h.at = fromDayKey(key, h.at);
  sortHistory();
  save();
  return true;
}

/* A day you didn't train. "missed" is one you owe; "rest" is one you planned.
   Neither advances the rotation — the workout you skipped is still the next
   one up, which is what you'd actually do at the gym. */
function addSkip(key, skipType, dayIndex, note){
  var day = state.days[dayIndex] || currentDay();
  var entry = {
    id: uid("h"),
    at: fromDayKey(key),
    kind: "skip",
    skipType: skipType === "rest" ? "rest" : "missed",
    dayId: day.id,
    dayName: day.name,
    notes: note || "",
    unit: state.prefs.unit,
    volume: 0,
    entries: []
  };
  state.history.push(entry);
  sortHistory();
  save();
  return entry;
}

/* --------------------------------------------------------------------------
   Bodyweight

   One entry per calendar day — weighing yourself twice on a Tuesday means
   the second reading replaces the first rather than making two points.
   -------------------------------------------------------------------------- */

function addBodyweight(w, key){
  var weight = Math.max(0, Math.round((parseFloat(w) || 0) * 10) / 10);
  if(!weight) return null;

  var at = fromDayKey(key || dayKey(Date.now()));
  var k = dayKey(at);
  var existing = null;

  state.body.forEach(function(b){ if(dayKey(b.at) === k) existing = b; });

  if(existing){
    existing.w = weight;
  }else{
    existing = { at:at, w:weight };
    state.body.push(existing);
  }

  state.body.sort(function(a, b){ return a.at - b.at; });
  save();
  return existing;
}

function removeBodyweight(at){
  state.body = state.body.filter(function(b){ return b.at !== at; });
  save();
}

function latestBodyweight(){
  return state.body.length ? state.body[state.body.length - 1] : null;
}

/* What you weighed around a given date. Walks back to the last reading on or
   before it; if the log only starts later, the earliest reading stands in,
   because a rough number beats dropping the point entirely. */
function bodyweightAt(ts){
  if(!state.body.length) return 0;
  var best = 0;
  for(var i = 0; i < state.body.length; i++){
    if(state.body[i].at <= ts) best = state.body[i].w;
    else break;
  }
  return best || state.body[0].w;
}

/* --------------------------------------------------------------------------
   Nutrition

   One entry per calendar day, keyed by the day itself ("2026-09-10") — food
   has no time of day worth keeping. Every field is optional, and a day with
   nothing left in it is removed rather than kept as an empty shell.

   TARGETS ARE PHASES, NOT A NUMBER. Each target starts on a date and holds
   until the next one begins, and a day is always judged against the target
   that was in force ON THAT DAY. Keep a single number instead and moving
   from a bulk to a cut would re-grade every bulk day as a day you blew it.
   -------------------------------------------------------------------------- */

var PHASES = { cut:"Cut", maintain:"Maintain", bulk:"Bulk" };

/* Blank means "not logged". A typed 0 is kept — a day with no fibre is a
   real day, and so is a fast. Negative or unreadable is treated as blank. */
function amount(v, places){
  if(v === null || v === undefined || String(v).trim() === "") return null;
  var n = parseFloat(v);
  if(!isFinite(n) || n < 0) return null;
  var f = Math.pow(10, places || 0);
  return Math.round(n * f) / f;
}

function nutritionOn(key){
  return state.nutrition.days[key] || null;
}

function setNutrition(key, vals){
  var entry = {
    kcal: amount(vals.kcal, 0),
    protein: amount(vals.protein, 1),
    fiber: amount(vals.fiber, 1)
  };

  if(entry.kcal === null && entry.protein === null && entry.fiber === null){
    delete state.nutrition.days[key];
    save();
    return null;
  }

  state.nutrition.days[key] = entry;
  save();
  return entry;
}

function clearNutrition(key){
  delete state.nutrition.days[key];
  save();
}

/* Every day with anything logged, newest first. */
function nutritionKeys(){
  return Object.keys(state.nutrition.days).sort().reverse();
}

function goalOn(key){
  var found = null;
  state.nutrition.goals.forEach(function(g){ if(g.from <= key) found = g; });
  return found;
}

function currentGoal(){ return goalOn(dayKey(Date.now())); }

/* A new target starting on `from`. One per start date — setting a second
   target for the same day corrects the first rather than stacking on it. */
function setGoal(spec){
  var kcal = amount(spec.kcal, 0);
  if(!kcal) return null;

  var goal = {
    from: spec.from || dayKey(Date.now()),
    kcal: kcal,
    phase: PHASES[spec.phase] ? spec.phase : ""
  };

  state.nutrition.goals = state.nutrition.goals.filter(function(g){
    return g.from !== goal.from;
  });
  state.nutrition.goals.push(goal);
  state.nutrition.goals.sort(function(a, b){ return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });
  save();
  return goal;
}

function removeGoal(from){
  state.nutrition.goals = state.nutrition.goals.filter(function(g){ return g.from !== from; });
  save();
}

/* The last `count` days, oldest first, INCLUDING the ones with nothing
   logged. The chart needs honest gaps: a missed Wednesday should look like
   a missing Wednesday, not close up so Thursday sits where it would be. */
function nutritionSeries(count){
  var out = [];
  var cursor = new Date(startOfDay(Date.now()));
  cursor.setDate(cursor.getDate() - (count - 1));

  for(var i = 0; i < count; i++){
    var key = dayKey(cursor.getTime());
    var food = nutritionOn(key);
    var goal = goalOn(key);
    var kcal = food ? food.kcal : null;

    out.push({
      key: key,
      at: fromDayKey(key),
      kcal: kcal,
      protein: food ? food.protein : null,
      fiber: food ? food.fiber : null,
      target: goal ? goal.kcal : null,
      phase: goal ? goal.phase : "",
      diff: (kcal !== null && goal) ? kcal - goal.kcal : null
    });

    cursor.setDate(cursor.getDate() + 1);      /* setDate walks DST cleanly */
  }
  return out;
}

/* Averages over a window, each one over ONLY the days that field was logged.
   A day you didn't write fibre down is not a day you ate none, so it can't
   be allowed to drag the average toward zero. */
function nutritionAverages(count){
  var rows = nutritionSeries(count);

  function avg(field){
    var vals = rows.map(function(r){ return r[field]; })
                   .filter(function(v){ return v !== null; });
    if(!vals.length) return { value:null, days:0 };
    var total = vals.reduce(function(n, v){ return n + v; }, 0);
    return { value: total / vals.length, days: vals.length };
  }

  return {
    window: count,
    kcal: avg("kcal"),
    diff: avg("diff"),
    protein: avg("protein"),
    fiber: avg("fiber")
  };
}

/* --------------------------------------------------------------------------
   Weight trend

   One weigh-in is mostly water — salt, carbs, a hard leg day, the time you
   went to bed. Averaging the last seven days of readings cancels most of
   that, which is why the 7-day average is the number the app leads with and
   a single reading is the footnote.
   -------------------------------------------------------------------------- */

var TREND_DAYS = 7;

/* A day key moved by n calendar days. Built from the date's parts so a DST
   change can't knock it a day sideways. */
function shiftKey(key, n){
  var b = String(key).split("-");
  return dayKey(new Date(+b[0], +b[1] - 1, +b[2] + n, 12).getTime());
}

function round1(n){ return Math.round(n * 10) / 10; }

/* The mean of every weigh-in in the 7 days ending on `key`, inclusive, and
   how many readings it's made of. null when there are none — one reading in
   the window is an average of one, and the count says so. */
function weekAverage(key){
  var from = shiftKey(key, -(TREND_DAYS - 1));
  var vals = [];

  state.body.forEach(function(b){
    var k = dayKey(b.at);
    if(k >= from && k <= key) vals.push(b.w);
  });
  if(!vals.length) return null;

  var total = vals.reduce(function(n, v){ return n + v; }, 0);
  return { value: round1(total / vals.length), count: vals.length, from: from, to: key };
}

/* What the Bodyweight tile says: this week's average against last week's.
   Week on week is the number that tells a cut or a bulk how it's going;
   "since the start" is what the chart is for. */
function weightTrend(){
  var today = dayKey(Date.now());
  var now = weekAverage(today);
  var prev = weekAverage(shiftKey(today, -TREND_DAYS));

  return {
    now: now,
    prev: prev,
    change: (now && prev) ? round1(now.value - prev.value) : null,
    latest: latestBodyweight()
  };
}

/* The trend as of each weigh-in, with the reading itself alongside — the
   chart draws the average as its line and the readings as faint dots. */
function bodyTrendSeries(){
  return state.body.map(function(b){
    var avg = weekAverage(dayKey(b.at));
    return { x: b.at, y: avg.value, raw: b.w, count: avg.count };
  });
}

/* Bodyweight "at the time" for anything that divides by it. The 7-day
   average where there is one, so a single heavy morning doesn't knock a
   point off your relative strength; the nearest reading otherwise. */
function trendWeightAt(ts){
  var avg = weekAverage(dayKey(ts));
  return avg ? avg.value : bodyweightAt(ts);
}

/* --------------------------------------------------------------------------
   Maintenance, from your own numbers

   Over a few weeks, what you ate and what the scale did pin down what you
   burn:

     maintenance = average intake − (weight change per day × energy per unit)

   Lose half a pound a week on 2,300 and you're burning about 2,550.

   Three details decide whether that's useful or misleading:

   · The weight change is the SLOPE of a line fitted through every weigh-in
     in the window, not the last reading minus the first. Two single days
     are mostly water; a fitted line through twenty isn't.
   · Intake averages only the days you logged. Unlogged days are unknown,
     not zero.
   · Nothing is shown until there's enough to stand on. A confident wrong
     number is worse than "not yet".

   The ± that comes with it is one standard error of the slope, turned into
   kilocalories: how much the weigh-ins disagree with the line they sit on.
   It shrinks with more weigh-ins and a steadier scale. It says nothing about
   how carefully the food was counted — but a consistent miscount cancels
   out, because the answer comes back in your own counting. That is exactly
   what a target needs, and exactly what no online calculator can give you.

   The window runs through YESTERDAY. Today's food isn't finished, and a
   breakfast-only today would drag the average down every morning.
   -------------------------------------------------------------------------- */

var TDEE_WINDOW = 21;
var TDEE_NEEDS = { kcalDays: 10, weighIns: 6, span: 10 };

/* The usual approximation for body tissue: 3,500 kcal a pound, 7,700 a kilo.
   Weights are stored in whatever unit the app is set to, so this follows. */
function energyPerUnit(){ return state.prefs.unit === "kg" ? 7700 : 3500; }

/* Ordinary least squares, plus the standard error of the slope. */
function fitLine(pts){
  var n = pts.length;
  var mx = 0, my = 0;
  pts.forEach(function(p){ mx += p.x; my += p.y; });
  mx /= n; my /= n;

  var sxx = 0, sxy = 0;
  pts.forEach(function(p){ sxx += (p.x - mx) * (p.x - mx); sxy += (p.x - mx) * (p.y - my); });

  var slope = sxx ? sxy / sxx : 0;
  var sse = 0;
  pts.forEach(function(p){
    var e = p.y - (my + slope * (p.x - mx));
    sse += e * e;
  });

  var se = (n > 2 && sxx) ? Math.sqrt(sse / (n - 2)) / Math.sqrt(sxx) : 0;
  return { slope: slope, se: se };
}

/* The estimate for the 21 days ending on `endKey`. Always says what it had
   to work with, and — when it isn't ready — exactly what it's still missing. */
function tdeeFor(endKey){
  var startKey = shiftKey(endKey, -(TDEE_WINDOW - 1));
  var kcals = [];
  var key = startKey;

  for(var i = 0; i < TDEE_WINDOW; i++){
    var food = nutritionOn(key);
    if(food && food.kcal !== null) kcals.push(food.kcal);
    key = shiftKey(key, 1);
  }

  var pts = [];
  state.body.forEach(function(b){
    var k = dayKey(b.at);
    if(k >= startKey && k <= endKey){
      pts.push({ x: daysBetween(fromDayKey(startKey), b.at), y: b.w });
    }
  });
  var span = pts.length ? pts[pts.length - 1].x - pts[0].x : 0;

  var out = {
    from: startKey,
    to: endKey,
    window: TDEE_WINDOW,
    kcalDays: kcals.length,
    weighIns: pts.length,
    span: span,
    need: {
      kcalDays: Math.max(0, TDEE_NEEDS.kcalDays - kcals.length),
      weighIns: Math.max(0, TDEE_NEEDS.weighIns - pts.length),
      span: Math.max(0, TDEE_NEEDS.span - span)
    },
    ready: false
  };

  if(out.need.kcalDays || out.need.weighIns || out.need.span) return out;

  var intake = kcals.reduce(function(n, v){ return n + v; }, 0) / kcals.length;
  var fit = fitLine(pts);
  var perUnit = energyPerUnit();

  out.ready = true;
  out.intake = Math.round(intake);
  out.perWeek = Math.round(fit.slope * 7 * 100) / 100;       /* unit per week */
  out.unit = state.prefs.unit;
  out.tdee = Math.round((intake - fit.slope * perUnit) / 10) * 10;
  out.band = Math.max(10, Math.round(fit.se * perUnit / 10) * 10);
  return out;
}

/* Now, and a week ago — so the card can say whether it's drifting. */
function tdee(){
  var today = dayKey(Date.now());
  var now = tdeeFor(shiftKey(today, -1));
  var weekAgo = tdeeFor(shiftKey(today, -1 - TREND_DAYS));

  return {
    now: now,
    weekAgo: weekAgo.ready ? weekAgo : null,
    change: (now.ready && weekAgo.ready) ? now.tdee - weekAgo.tdee : null
  };
}

/* --------------------------------------------------------------------------
   Progress — turning the log into something plottable
   -------------------------------------------------------------------------- */

/* Epley. It's an estimate and it drifts above about ten reps, but it's the
   standard one and this only ever feeds a trend line, where consistency
   matters more than absolute truth. */
function e1rm(w, r){
  if(!w || !r) return 0;
  return w * (1 + r / 30);
}

/* Every movement you've actually logged, most-trained first — the order the
   exercise picker offers them in. */
function loggedExercises(){
  var counts = {};
  sessionsOnly().forEach(function(h){
    h.entries.forEach(function(en){
      if(en.completed > 0) counts[en.name] = (counts[en.name] || 0) + 1;
    });
  });
  return Object.keys(counts).sort(function(a, b){
    return counts[b] - counts[a] || a.localeCompare(b);
  });
}

/* The strength trend for one movement.

   metric "load" is an estimated 1RM, and for pull-ups and dips your
   bodyweight at the time (the 7-day average) is added in — a chin-up at
   150lb and the same rep at 190lb are not the same lift. metric "reps" is the fallback for anything
   never logged with a load (and no bodyweight on file to supply one), where
   more reps IS the progress. */
function exerciseSeries(name){
  var raw = [];
  var anyLoad = false;

  sessionsOnly().forEach(function(h){
    h.entries.forEach(function(en){
      if(en.name !== name || !en.completed) return;

      var bw = trendWeightAt(h.at);
      var carried = data.BODYWEIGHT[name] ? bw : 0;
      var best = 0;
      var reps = 0;

      (en.logged || []).forEach(function(item){
        item.segs.forEach(function(s){
          best = Math.max(best, e1rm((s.w || 0) + carried, s.r));
        });
        reps = Math.max(reps, totalReps(item.segs));
      });

      if(best > 0) anyLoad = true;
      raw.push({ at:h.at, load:best, reps:reps, bw:bw });
    });
  });

  var metric = anyLoad ? "load" : "reps";
  var points = [];

  raw.forEach(function(p){
    var v = metric === "load" ? p.load : p.reps;
    if(!v) return;                      /* a session with nothing usable */
    points.push({ x:p.at, y:Math.round(v * 10) / 10, bw:p.bw });
  });

  return { name:name, metric:metric, points:points };
}

/* The same series divided by what you weighed that week — "am I getting
   stronger for my size", which is the question a changing bodyweight makes
   hard to answer from load alone. Points with no bodyweight on file can't
   be expressed this way and are left out. */
function relativeSeries(series){
  return {
    name: series.name,
    metric: series.metric,
    points: series.points.filter(function(p){ return p.bw > 0; }).map(function(p){
      return { x:p.x, y:Math.round(p.y / p.bw * 100) / 100, bw:p.bw };
    })
  };
}

function volumeSeries(){
  return sessionsOnly().map(function(h){
    return { x:h.at, y:h.volume || 0 };
  });
}

/* One row per calendar day for the consistency grid, oldest first, always
   starting on a Sunday so the columns line up as weeks. */
function calendar(weeks){
  var byDay = {};
  state.history.forEach(function(h){
    var k = dayKey(h.at);
    /* A session outranks a skip on the same date — if you logged a workout,
       that day counts as trained whatever else got recorded. */
    if(!byDay[k] || isSkip(byDay[k])) byDay[k] = h;
  });

  var end = startOfDay(Date.now());
  var cursor = new Date(end);
  cursor.setDate(cursor.getDate() - (weeks * 7 - 1));
  cursor.setDate(cursor.getDate() - cursor.getDay());     /* back to Sunday */

  var volumes = sessionsOnly().map(function(h){ return h.volume || 0; })
                              .filter(function(v){ return v > 0; })
                              .sort(function(a, b){ return a - b; });
  var mid = volumes.length ? volumes[Math.floor(volumes.length / 2)] : 0;

  var cells = [];
  var day = cursor.getTime();

  while(startOfDay(day) <= end){
    var k = dayKey(day);
    var hit = byDay[k];
    var level = 0;

    if(hit && !isSkip(hit)){
      level = !mid ? 2 : (hit.volume >= mid * 1.25 ? 3 : hit.volume >= mid * 0.6 ? 2 : 1);
    }

    cells.push({
      at: day,
      key: k,
      state: hit ? (isSkip(hit) ? hit.skipType : "trained") : "none",
      level: level,
      entry: hit || null
    });

    day += DAY_MS;
    day = startOfDay(day) + DAY_MS / 2;   /* re-anchor at midday past DST */
  }

  return cells;
}

/* The headline numbers above the charts. */
function summary(){
  var sessions = sessionsOnly();
  var first = state.history.length ? state.history[0].at : null;
  var since = first ? Math.max(1, Math.ceil((daysBetween(first, Date.now()) + 1) / 7)) : 0;

  var monthAgo = Date.now() - 30 * DAY_MS;
  var recent = sessions.filter(function(h){ return h.at >= monthAgo; });
  var missed = skipsOnly().filter(function(h){
    return h.skipType === "missed" && h.at >= monthAgo;
  });

  /* Bodyweight isn't summarised here any more — it has its own trend (see
     weightTrend), because a single reading makes a poor headline. */
  return {
    sessions: sessions.length,
    weeks: since,
    since: first,
    last30: recent.length,
    missed30: missed.length,
    volume: sessions.reduce(function(n, h){ return n + (h.volume || 0); }, 0)
  };
}

/* --------------------------------------------------------------------------
   Mutations
   -------------------------------------------------------------------------- */

function newExercise(name){ return planned(name); }

function clampSets(n){
  return Math.min(MAX_SETS, Math.max(1, parseInt(n, 10) || 1));
}

function setSets(e, n){
  e.sets = clampSets(n);
  e.log.length = e.sets;   /* drop logs for sets that no longer exist */
  return e.sets;
}

function addWeight(e, delta){
  /* Round to 2dp so 2.5 steps don't drift into float noise. */
  e.weight = Math.max(0, Math.round(((+e.weight || 0) + delta) * 100) / 100);
  return e.weight;
}

/* One tap: assume the working weight and the top of the rep target. */
function quickLog(e, k){
  e.log[k] = [{ w:(e.weight || 0), r:repTop(e.reps) }];
  return e.log[k];
}

function clearSet(e, k){ e.log[k] = null; }

/* A drop starts one step lighter and at roughly half the reps — both are
   just a sensible place for the steppers to begin. */
function addSegment(e, k){
  var segs = e.log[k];
  if(!segs) segs = quickLog(e, k);
  var prev = segs[segs.length - 1];
  segs.push({
    w: Math.max(0, Math.round((prev.w - state.prefs.step) * 100) / 100),
    r: Math.max(1, Math.round(prev.r / 2))
  });
  return segs;
}

function removeSegment(e, k, index){
  var segs = e.log[k];
  if(!segs || segs.length <= 1) return false;
  segs.splice(index, 1);
  return true;
}

function setSegmentWeight(e, k, index, value){
  var seg = e.log[k] && e.log[k][index];
  if(!seg) return 0;
  seg.w = Math.max(0, Math.round((value || 0) * 100) / 100);
  return seg.w;
}

function setSegmentReps(e, k, index, value){
  var seg = e.log[k] && e.log[k][index];
  if(!seg) return 0;
  seg.r = Math.min(999, Math.max(0, parseInt(value, 10) || 0));
  return seg.r;
}

function moveExercise(day, from, to){
  if(to < 0 || to >= day.ex.length) return false;
  var moved = day.ex.splice(from, 1)[0];
  day.ex.splice(to, 0, moved);
  return true;
}

/* Log the session, clear the sets, advance the rotation.
   Returns the finished day so the caller can report on it. */
function finishSession(){
  var day = currentDay();
  var volume = 0;

  var entries = day.ex.map(function(e){
    var logged = [];
    var heaviest = 0;
    var exVolume = 0;

    for(var k = 0; k < e.sets; k++){
      if(!isLogged(e, k)) continue;
      var segs = e.log[k].map(function(s){ return { w:s.w, r:s.r }; });
      logged.push({ set:k + 1, segs:segs });
      heaviest = Math.max(heaviest, topWeight(segs));
      exVolume += segmentVolume(segs);
    }

    volume += exVolume;
    return {
      name: e.name,
      sets: e.sets,
      target: e.reps,
      completed: logged.length,
      topWeight: heaviest,
      volume: Math.round(exVolume),
      logged: logged
    };
  });

  var record = {
    id: uid("h"),
    at: Date.now(),
    kind: "session",
    dayId: day.id,
    dayName: day.name,
    notes: day.notes,
    unit: state.prefs.unit,
    volume: Math.round(volume),
    entries: entries
  };

  state.history.push(record);
  sortHistory();   /* a backdated skip may already sit after "now" */

  day.ex.forEach(function(e){ e.log = []; });
  day.notes = "";

  /* Set the day up for next time while the session is still in hand: loads
     move on what you actually hit, and a slot or two may change hands. It
     happens here rather than in app.js so every route to a finished session
     gets the same treatment. */
  var changes = IL.plan ? IL.plan.advance(day, record) : [];

  if(state.day === state.days.length - 1) state.cycle++;
  state.day = (state.day + 1) % state.days.length;

  save();
  return { day:day, record:record, changes:changes };
}

/* --------------------------------------------------------------------------
   Getting the data out (and back in)

   Nothing here talks to the network. These produce text; app.js decides
   whether that text becomes a download or goes into the share sheet.
   -------------------------------------------------------------------------- */

function csvCell(v){
  var s = (v === null || v === undefined) ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/* One row per weight lifted — a set with a drop in it is two rows sharing a
   set number, so nothing is averaged away before it reaches a spreadsheet.
   Skipped days get a row of their own so the gaps are explicit. */
function toCSV(){
  var header = [
    "date","time","day","type","exercise","set","segment",
    "weight","reps","unit","volume","bodyweight","notes",
    "calories","calorie_target","protein_g","fiber_g"
  ];
  var rows = [header];

  state.history.forEach(function(h){
    var d = new Date(h.at);
    var date = dayKey(h.at);
    var time = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    var bw = bodyweightAt(h.at) || "";
    var noteUsed = false;

    function note(){
      if(noteUsed) return "";
      noteUsed = true;
      return h.notes || "";
    }

    if(isSkip(h)){
      rows.push([date, time, h.dayName, h.skipType, "", "", "", "", "", "", 0, bw, note()]);
      return;
    }

    h.entries.forEach(function(en){
      if(!en.logged || !en.logged.length){
        rows.push([date, time, h.dayName, "not done", en.name, "", "", "", "",
                   h.unit || "lb", 0, bw, note()]);
        return;
      }
      en.logged.forEach(function(item){
        item.segs.forEach(function(s, i){
          rows.push([
            date, time, h.dayName, "set", en.name, item.set, i + 1,
            s.w || 0, s.r || 0, h.unit || "lb",
            Math.round((s.w || 0) * (s.r || 0)), bw, note()
          ]);
        });
      });
    });
  });

  /* Weigh-ins ride along in the same file, so one export is the whole story. */
  state.body.forEach(function(b){
    rows.push([dayKey(b.at), "", "", "weigh-in", "", "", "", b.w, "",
               state.prefs.unit, "", b.w, ""]);
  });

  /* And so does food, with the target that was in force that day — the
     spreadsheet can do its own over/under without knowing about phases. */
  nutritionKeys().slice().reverse().forEach(function(key){
    var food = nutritionOn(key);
    var goal = goalOn(key);
    rows.push([key, "", "", "nutrition", "", "", "", "", "", "", "", "", "",
               food.kcal, goal ? goal.kcal : "", food.protein, food.fiber]);
  });

  /* Rows written before the nutrition columns existed just end early. */
  rows.forEach(function(r){ while(r.length < header.length) r.push(""); });

  return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
}

function toBackup(){
  return JSON.stringify(state, null, 2);
}

/* Replace everything with a backup file. Throws if the text isn't one, so
   the caller can tell you rather than silently wiping the log. */
function restore(text){
  var incoming = JSON.parse(text);
  if(!looksLikeSave(incoming)) throw new Error("Not an Iron Ledger backup.");
  state = normalize(incoming);
  save();
  return state;
}

/* Stamped whenever a copy actually leaves the device, so the Data panel can
   say how long it has been. Snapshots do NOT count — they live in the same
   origin as the thing they are backing up. */
function markExported(){
  state.prefs.lastExport = Date.now();
  save();
  return state.prefs.lastExport;
}

function daysSinceExport(){
  if(!state.prefs.lastExport) return null;
  return daysBetween(state.prefs.lastExport, Date.now());
}

function exportName(ext){
  return "iron-ledger-" + dayKey(Date.now()) + "." + ext;
}

IL.store = {
  MAX_SETS: MAX_SETS,

  get state(){ return state; },
  set onSaveError(fn){ onSaveError = fn; },

  save: save,
  reset: reset,
  seed: seed,

  dayKey: dayKey,
  fromDayKey: fromDayKey,
  daysBetween: daysBetween,

  uid: uid,
  repTop: repTop,
  repBottom: repBottom,
  repChoices: repChoices,
  totalReps: totalReps,
  segmentVolume: segmentVolume,
  topWeight: topWeight,
  isLogged: isLogged,

  currentDay: currentDay,
  customLib: customLib,
  libLookup: libLookup,
  libAll: libAll,
  libResolve: libResolve,
  isCustom: isCustom,
  addCustomExercise: addCustomExercise,
  removeCustomExercise: removeCustomExercise,
  poolFor: poolFor,

    var head = readDate(line);

      sessions.push(current);

    }

    var noteHit = line.match(/^(?:notes?|comment)\s*[:\-]\s*(.*)$/i);
    if(noteHit && current){

      return;

    if(!current){

      return;

    var ex = readExercise(line);
    if(!ex){
      errors.push({ line:i + 1, text:line, why:"no sets found in it" });
      return;

  sessions.sort(function(a, b){ return a.at - b.at; });

  var volume = 0;

    s.entries.forEach(function(en){

      en.sets.forEach(function(segs){ volume += store.segmentVolume(segs); });

    sessions: sessions,
    errors: errors,
    unknown: Object.keys(unknown),
    sets: sets,

   program you no longer run is still a real day you trained. */

  if(!want) return null;

    return d.name.toLowerCase().replace(/[^a-z0-9]+/g, "");

  for(i = 0; i < days.length; i++){
    if(want === days[i].id.toLowerCase() || want === keys[i]) return days[i];
  }
  for(i = 0; i < days.length; i++){

  var hi = Math.ceil(max / step) * step;

  return { lo:lo, hi:hi, ticks:ticks };
}

/* Diverging bars hang off zero, and zero is the whole point — it's the
   target line. So the window always contains it, and always has at least one
   step of room on BOTH sides: a fortnight that happens to be all under still
   shows where "over" would have been, rather than pinning the target line to
   the top edge where it reads as a border. */
function divergingAxis(min, max){
  min = Math.min(0, min);
  max = Math.max(0, max);
  if(min === max) max = 100;                  /* every day exactly on target */

  var step = niceStep(max - min, 4);
  var lo = Math.floor(min / step) * step;
  var hi = Math.ceil(max / step) * step;
  if(lo === 0) lo = -step;
  if(hi === 0) hi = step;

  return withTicks(lo, hi, step);
}

/* --------------------------------------------------------------------------
   Drawing
   -------------------------------------------------------------------------- */

function gridHTML(a, Y, w){
  return a.ticks.map(function(v){
    var y = Y(v);
    return '<line class="c-grid" x1="' + PAD.l + '" x2="' + (w - PAD.r) +
             '" y1="' + y + '" y2="' + y + '"></line>' +
           '<text class="c-tick" x="' + (PAD.l - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' +
             esc(a.fmt(v)) + '</text>';
  }).join("");
}

/* First, middle and last only. A label under every point is unreadable at
   phone width, and the readout carries the rest. */
function xLabelsHTML(pts, X, cfg){
  var picks = pts.length > 2
    ? [0, Math.floor((pts.length - 1) / 2), pts.length - 1]
    : [0, pts.length - 1];
  var seen = {};

  return picks.map(function(i, n){
    if(seen[i]) return "";
    seen[i] = 1;
    var anchor = n === 0 ? "start" : (i === pts.length - 1 ? "end" : "middle");
    return '<text class="c-tick" x="' + X(pts[i], i).toFixed(1) + '" y="' + (H - 6) +
             '" text-anchor="' + anchor + '">' + esc(cfg.fmtX(pts[i].x)) + '</text>';
  }).join("");
}

function linePath(pts, X, Y){
  return pts.map(function(p, i){
    return (i ? "L" : "M") + X(p, i).toFixed(1) + " " + Y(p.y).toFixed(1);
  }).join(" ");
}

/* Square at the baseline, 4px rounded at the data end — the cap marks where
   the value stops without the whole mark turning into a lozenge. */
function barPath(x, y, w, bottom){
  var r = Math.min(4, w / 2, Math.max(0, bottom - y));
  return "M" + x + " " + bottom +
         "V" + (y + r) +
         "a" + r + " " + r + " 0 0 1 " + r + " " + (-r) +
         "h" + (w - r * 2) +
         "a" + r + " " + r + " 0 0 1 " + r + " " + r +
         "V" + bottom + "Z";
}

/* The same bar hanging DOWN from a baseline: square where it meets the line,
   rounded at the data end, which is now the bottom. */
function barPathDown(x, y, w, top){
  var r = Math.min(4, w / 2, Math.max(0, y - top));
  return "M" + x + " " + top +
         "V" + (y - r) +
         "a" + r + " " + r + " 0 0 0 " + r + " " + r +
         "h" + (w - r * 2) +
         "a" + r + " " + r + " 0 0 0 " + r + " " + (-r) +
         "V" + top + "Z";
}

/* --------------------------------------------------------------------------
   draw(host, cfg)

     cfg.points   [{ x, y }]   x is a timestamp, y the value
     cfg.kind     "line" | "column" | "diverging"
     cfg.fmtY     axis tick     -> string
     cfg.fmtV     readout value -> string; gets (y, point)
     cfg.fmtX     timestamp     -> string
     cfg.empty    what to say when there isn't enough to plot

   "diverging" is a column chart around zero instead of up from it: positive
   bars rise in the "over" colour, negative ones hang in the "under" colour.
   Its points may carry y:null for a slot with nothing in it — the slot keeps
   its place on the axis and simply has no bar, so a gap reads as a gap.

     cfg.raw      [{ x, y }]   line only: the readings the line summarises,
                               drawn underneath as faint dots on the same
                               scale. The line is the signal and the dots are
                               the context, so the line's own per-point dots
                               step aside for them.
   -------------------------------------------------------------------------- */

function draw(host, cfg){
  if(!host) return;

  var pts = cfg.points || [];
  var diverging = cfg.kind === "diverging";
  var banded = cfg.kind !== "line";
  var real = pts.filter(function(p){ return p.y !== null && p.y !== undefined; });
  var need = banded ? 1 : 2;

  if(real.length < need){
    host.innerHTML = '<p class="chart-empty">' + esc(cfg.empty || "Nothing to plot yet.") + '</p>';
    return;
  }

  var w = Math.max(260, Math.round(host.clientWidth || 320));
  var pw = w - PAD.l - PAD.r;
  var ph = H - PAD.t - PAD.b;

  var raw = (!banded && cfg.raw) ? cfg.raw : [];

  /* The scale has to hold the readings as well as the line through them —
     the line is an average, so the readings always reach further. */
  var ys = real.map(function(p){ return p.y; })
               .concat(raw.map(function(p){ return p.y; }));
  var lo = Math.min.apply(null, ys);
  var hi = Math.max.apply(null, ys);
  var a = diverging ? divergingAxis(lo, hi) : axis(lo, hi, cfg.kind === "column");
  a.fmt = cfg.fmtY;

  var Y = function(v){ return PAD.t + ph * (1 - (v - a.lo) / (a.hi - a.lo)); };

  var band = pw / pts.length;
  var thick = Math.max(3, Math.min(24, band - 2));   /* 2px gap between bars */
  var x0 = pts[0].x;
  var x1 = pts[pts.length - 1].x;

  var X = banded
    ? function(p, i){ return PAD.l + band * (i + 0.5); }
    : function(p){ return x1 === x0 ? PAD.l + pw / 2 : PAD.l + pw * (p.x - x0) / (x1 - x0); };

  var marks;

  if(diverging){
    var zero = Y(0);
    marks = pts.map(function(p, i){
      if(p.y === null || p.y === undefined || p.y === 0) return "";
      var left = (X(p, i) - thick / 2).toFixed(1);
      var over = p.y > 0;
      return '<path class="c-bar" data-i="' + i + '" data-dir="' + (over ? "over" : "under") +
        '" data-hi="0" d="' +
        (over ? barPath(left, Y(p.y).toFixed(1), thick, zero)
              : barPathDown(left, Y(p.y).toFixed(1), thick, zero)) + '"></path>';
    }).join("") +
    /* Drawn over the bars, so the target line reads as one unbroken rule. */
    '<line class="c-zero" x1="' + PAD.l + '" x2="' + (w - PAD.r) +
      '" y1="' + zero + '" y2="' + zero + '"></line>';
  }else if(cfg.kind === "column"){
    marks = pts.map(function(p, i){
      return '<path class="c-bar" data-i="' + i + '" data-hi="0" d="' +
        barPath((X(p, i) - thick / 2).toFixed(1), Y(p.y).toFixed(1), thick, Y(a.lo)) + '"></path>';
    }).join("");
  }else{
    var d = linePath(pts, X, Y);
    var base = Y(a.lo);
    var lastX = X(pts[pts.length - 1], pts.length - 1).toFixed(1);

    marks =
      raw.map(function(p){
        return '<circle class="c-raw" cx="' + X(p).toFixed(1) +
               '" cy="' + Y(p.y).toFixed(1) + '" r="3"></circle>';
      }).join("") +
      '<path class="c-area" d="' + d + ' L' + lastX + ' ' + base +
        ' L' + X(pts[0], 0).toFixed(1) + ' ' + base + ' Z"></path>' +
      '<path class="c-line" d="' + d + '"></path>' +
      /* Intermediate dots only while they can still be told apart; past that
         they merge into a caterpillar and the bare line reads better. */
      (pts.length <= 12 && !raw.length ? pts.map(function(p, i){
        return '<circle class="c-dot" cx="' + X(p, i).toFixed(1) +
               '" cy="' + Y(p.y).toFixed(1) + '" r="4"></circle>';
      }).join("") : "") +
      '<circle class="c-dot end" cx="' + lastX +
        '" cy="' + Y(pts[pts.length - 1].y).toFixed(1) + '" r="4.5"></circle>';
  }

  var last = pts[pts.length - 1];

  host.innerHTML =
    '<div class="chart-read" data-read>' +
      '<b>' + esc(cfg.fmtV(last.y, last)) + '</b><span>' + esc(cfg.fmtX(last.x)) + '</span>' +
    '</div>' +
    '<svg class="chart" width="' + w + '" height="' + H + '" viewBox="0 0 ' + w + ' ' + H +
      '" role="img" aria-label="' + esc(cfg.label || "chart") + '">' +
      gridHTML(a, Y, w) +
      marks +
      xLabelsHTML(pts, X, cfg) +
      '<g class="c-cross" data-cross hidden>' +
        '<line y1="' + PAD.t + '" y2="' + (H - PAD.b) + '"></line>' +
        '<circle r="5.5"></circle>' +
      '</g>' +
      '<rect x="' + PAD.l + '" y="' + PAD.t + '" width="' + pw + '" height="' + ph +
        '" fill="transparent" data-hit></rect>' +
    '</svg>';

  wire(host, pts, X, Y, cfg, band);
}

/* One pointer handler covers mouse and touch. Tapping or dragging across the
   plot moves the crosshair and rewrites the readout above it; leaving snaps
   back to the most recent point. */
function wire(host, pts, X, Y, cfg, band){
  var svg = host.querySelector("svg");
  var cross = host.querySelector("[data-cross]");
  var line = cross.querySelector("line");
  var dot = cross.querySelector("circle");
  var read = host.querySelector("[data-read]");
  var bars = host.querySelectorAll(".c-bar");

  function paintRead(p){
    read.innerHTML = '<b>' + esc(cfg.fmtV(p.y, p)) + '</b><span>' + esc(cfg.fmtX(p.x)) + '</span>';
  }

  /* Matched on the point index each bar was drawn for, not its position in
     the list — once some slots have no bar, the nth bar is not the nth day. */
  function highlight(index){
    for(var b = 0; b < bars.length; b++){
      bars[b].dataset.hi = (Number(bars[b].dataset.i) === index) ? "1" : "0";
    }
  }

  function show(i){
    var p = pts[i];
    var x = X(p, i);
    var empty = p.y === null || p.y === undefined;
    line.setAttribute("x1", x);
    line.setAttribute("x2", x);
    dot.setAttribute("cx", x);
    dot.setAttribute("cy", empty ? 0 : Y(p.y));
    dot.setAttribute("visibility", empty ? "hidden" : "visible");
    cross.hidden = false;
    paintRead(p);
    highlight(i);
  }

  function reset(){
    cross.hidden = true;
    paintRead(pts[pts.length - 1]);
    highlight(-1);
  }

  function at(ev){
    var px = ev.clientX - svg.getBoundingClientRect().left;
    var best = 0;

    if(cfg.kind !== "line"){
      best = Math.max(0, Math.min(pts.length - 1, Math.floor((px - PAD.l) / band)));
    }else{
      var nearest = Infinity;
      for(var i = 0; i < pts.length; i++){
        var gap = Math.abs(X(pts[i], i) - px);
        if(gap < nearest){ nearest = gap; best = i; }
      }
    }
    show(best);
  }

  svg.addEventListener("pointermove", at);
  svg.addEventListener("pointerdown", at);
  svg.addEventListener("pointerleave", reset);
}

IL.chart = { draw: draw, height: H };

})(window.IL);


/* ==========================================================================
   ui.js — everything that produces markup.

   Rendering is split two ways on purpose:
     renderTrain()      rebuilds the whole day; used for structural changes
                        (add, remove, reorder, set count, switching days)
     patchExercise(i)   swaps one row and updates the counter; used for the
                        hot path of logging sets, so typing in the notes box
                        or scrolling is never interrupted.
   ========================================================================== */

window.IL = window.IL || {};

(function(IL){
"use strict";

var data = IL.data;
var store = IL.store;

function $(id){ return document.getElementById(id); }

var viewEl, sheetEl, scrimEl, toastEl;

/* -------------------------------------------------------------------------- */

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;" }[c];
  });
}

function unit(){ return store.state.prefs.unit; }

function formatWeight(w, name){
  if(w) return String(w);
  return (name && store.isBodyweight(name)) ? "BW" : "—";
}

function formatLoad(e){
  if(!e.weight) return store.isBodyweight(e.name) ? "BW" : "— " + unit();
  return e.weight + " " + unit();
}

function formatClock(secs){
  return Math.floor(secs / 60) + ":" + ("0" + (secs % 60)).slice(-2);
}

function formatDate(ts){
  var d = new Date(ts);
  return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }) + " · " +
         d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}

/* Date without the clock — for skipped days, which have no time of day, and
   for chart axes. The year only appears once it isn't this one. */
function formatDay(ts){
  var d = new Date(ts);
  var opts = { month:"short", day:"numeric" };
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}

function formatWeekday(ts){
  return new Date(ts).toLocaleDateString(undefined, {
    weekday:"short", month:"short", day:"numeric"
  });
}

/* "8, 8, 5+3" — a set with drops shows its segments joined by a plus. */
function repsSummary(logged){
  if(!logged || !logged.length) return "";
  return logged.map(function(item){
    return item.segs.map(function(s){ return s.r; }).join("+");
  }).join(", ");
}

/* "185×5 → 155×3" — the full story of one set. */
function segsDetail(segs, name){
  return segs.map(function(s){
    return formatWeight(s.w, name) + "×" + s.r;
  }).join(" → ");
}

/* -------------------------------------------------------------------------- */

var toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2800);
}

/* --------------------------------------------------------------------------
   What the last session decided

   Every exercise carries the note the progression rule left on it — why it
   is at this weight today. Showing it is most of the point: a number that
   moved on its own is unnerving until you can see the reason.
   -------------------------------------------------------------------------- */

/* The rules write their notes as "decision — because", so the decision can
   be bold and the reasoning can be quiet. */
function planLine(e){
  if(!e.progress || !e.progress.note) return "";

  var bits = String(e.progress.note).split(" — ");
  return '<p class="ex-plan" data-kind="' + esc(e.progress.kind) + '">' +
    '<b>' + esc(bits[0]) + '</b>' +
    (bits.length > 1 ? '<span>' + esc(bits.slice(1).join(" — ")) + '</span>' : '') +
  '</p>';
}

/* One line above the day, so the changes are visible before you scroll. */
function planBanner(day){
  var n = { up:0, down:0, swap:0, hold:0 };

  day.ex.forEach(function(e){
    if(e.progress && n[e.progress.kind] !== undefined) n[e.progress.kind]++;
  });
  if(!n.up && !n.down && !n.swap) return "";

  var parts = [];
  if(n.up)   parts.push(n.up + " load" + (n.up === 1 ? "" : "s") + " up");
  if(n.down) parts.push(n.down + " backed off");
  if(n.swap) parts.push(n.swap + " new exercise" + (n.swap === 1 ? "" : "s"));

  return '<div class="planbar">' +
    '<span class="k">Since last time</span>' +
    '<b>' + esc(parts.join(" · ")) + '</b>' +
  '</div>';
}

/* --------------------------------------------------------------------------
   Rotation rail

/* Unlogged: "Set 2" over the rep target.

function setButton(e, row, k){

  var logged = store.isLogged(e, k);

  if(logged){
    top = formatWeight(store.topWeight(segs), e.name) + (segs.length > 1 ? " ▾" : "");
    big = store.totalReps(segs);
    label = "Set " + (k + 1) + ", " + segsDetail(segs, e.name) + ". Edit.";

  return '<button class="set" data-set="' + row + ',' + k + '"' +

}

/* Getting the log off the phone. Everything here is generated on the device
   and handed to you — nothing is uploaded anywhere, because there is nowhere
   to upload it to. */
/* How long since a copy actually left the device. Snapshots don't count —
   they sit in the same origin as the thing they're backing up, so a wiped
   phone takes both. */
function exportAge(){
  var history = store.state.history.length;
  if(!history) return null;

  var days = store.daysSinceExport();
  if(days === null){
    return { stale:true, text:"You have never taken a copy off this device." };
  }
  if(days >= 30){
    return { stale:true, text:"Last copy off this device: " + days + " days ago." };
  }
  return {
    stale: false,
    text: days === 0 ? "Copied off this device today."
        : days === 1 ? "Copied off this device yesterday."
        : "Copied off this device " + days + " days ago."
  };
}

function dataPanel(){
  var canShare = !!(navigator.share && navigator.canShare);
  var age = exportAge();

  return '<div class="settings">' +
    '<h3 class="set-title">Your data</h3>' +
    '<p class="hint">' + store.state.history.length + ' entries and ' +
      store.state.body.length + ' weigh-ins, saved on this device.</p>' +

    (age
      ? (age.stale
          ? '<p class="nudge">' + esc(age.text) + ' Clearing your browser data ' +
              'or losing the phone would take all of it. Send yourself a backup.</p>'
          : '<p class="hint good">' + esc(age.text) + '</p>')
      : '') +

    '<div class="datarow">' +
      '<button class="add-btn" id="expCSV">Spreadsheet (CSV)</button>' +
      '<button class="add-btn" id="expJSON">Full backup</button>' +
    '</div>' +
    (canShare
      ? '<button class="add-btn" id="expShare">Send it to myself…</button>'
      : '') +
    '<div class="datarow">' +
      '<button class="add-btn" id="expCopy">Copy CSV</button>' +
      '<button class="add-btn" id="impPick">Restore a backup</button>' +
    '</div>' +
    '<input id="impFile" type="file" accept=".json,application/json" hidden>' +
    '<p class="hint">The CSV has one row per weight you lifted, so a drop set ' +
      'stays two rows. The backup restores everything exactly, on any device.</p>' +

    '<h3 class="set-title">Snapshots</h3>' +
    '<p class="hint" id="storeStat">Checking storage…</p>' +
    '<div id="snapList"></div>' +
    '<button class="add-btn" id="snapNow">+ Snapshot right now</button>' +
    '<p class="hint">Taken automatically after every session and before ' +

/* --------------------------------------------------------------------------
   The asynchronous half of the Data panel

   Snapshots and the storage estimate both come from promises, so they are
   filled in after the panel is on screen rather than holding up the render.
   -------------------------------------------------------------------------- */

/* Non-breaking space between number and unit, so "13 kB" never wraps into
   "13" on one line and "kB" on the next. */
function formatBytes(n){
  var MB = 1024 * 1024;
  if(!n) return "0 kB";
  if(n < MB) return Math.max(1, Math.round(n / 1024)) + " kB";
  if(n < 1024 * MB) return (n / MB).toFixed(1).replace(/\.0$/, "") + " MB";
  return Math.round(n / 1024 / MB) + " GB";
}

function formatStamp(ts){
  var d = new Date(ts);
  return formatDay(ts) + " · " +
         d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}

function snapshotRow(row){
  return '<div class="snaprow">' +
    '<div class="snapwhen">' +
      '<b>' + esc(row.reason) + '</b>' +
      '<small>' + esc(formatStamp(row.at)) + ' · ' + row.sessions +
        ' session' + (row.sessions === 1 ? "" : "s") +
        ' · ' + esc(formatBytes(row.bytes)) + '</small>' +
    '</div>' +
    '<button class="snapgo" data-snaprestore="' + row.id + '">Restore</button>' +
    '<button class="segdel" data-snapdel="' + row.id + '">Delete</button>' +
  '</div>';
}

function paintDataPanel(){
  var listEl = $("snapList");
  var statEl = $("storeStat");
  if(!listEl || !statEl || !IL.vault) return;

  IL.vault.status().then(function(st){
    if(!$("storeStat")) return;

    var bits = [];
    if(st.persisted === true)       bits.push("Storage is marked persistent — the browser won't evict it to reclaim space.");
    else if(st.persisted === false) bits.push("The browser has this as best-effort storage, so it could be evicted under pressure. Keep exporting.");
    else                            bits.push("This browser doesn't say whether it will keep the data. Keep exporting.");

    if(st.estimate && st.estimate.usage){
      bits.push("Using " + formatBytes(st.estimate.usage) +
                (st.estimate.quota ? " of " + formatBytes(st.estimate.quota) : "") + ".");
    }
    $("storeStat").textContent = bits.join(" ");
  });

  IL.vault.list().then(function(rows){
    if(!$("snapList")) return;

    $("snapList").innerHTML = rows.length
      ? rows.map(snapshotRow).join("")
      : '<p class="hint">No snapshots yet. One is taken the next time you ' +
        'finish a session.</p>';
  });
}

function renderLog(openId){
  var history = store.state.history;
  var sessions = store.sessionsOnly().length;
  var skips = store.skipsOnly().length;
  var body;

  if(!history.length){
    body = '<p class="empty">No sessions logged yet. Finish a workout and it lands here with every rep you did.</p>';
  }else{
    var cards = [];
    for(var i = history.length - 1; i >= 0; i--){
      var h = history[i];
      cards.push(store.isSkip(h) ? skipCard(h, openId === h.id) : sessionCard(h, openId === h.id));
    }
    body = cards.join("");
  }

  viewEl.innerHTML =
    '<div class="session-head">' +
      '<div>' +
        '<h2>Training log</h2>' +
        '<p class="sub">' + sessions + ' session' + (sessions === 1 ? "" : "s") +
          (skips ? ' · ' + skips + ' day' + (skips === 1 ? "" : "s") + ' off' : '') +
        '</p>' +
      '</div>' +
    '</div>' +
    '<div class="hist">' +
      '<div class="datarow">' +
        '<button class="add-btn" id="addPast">+ Past workouts</button>' +
        '<button class="add-btn" id="addSkip">+ Missed or rest day</button>' +
      '</div>' +
      body + settingsPanel() + dataPanel() +
    '</div>';

  $("actionbar").hidden = true;
  renderRail("log");
  paintDataPanel();
}

/* --------------------------------------------------------------------------
   Progress

   Three questions, three charts: is the weight on the bar going up, is my
   own weight moving under it, and am I actually showing up. The picked
   exercise and the ×bodyweight toggle live here rather than in app.js
   because a resize has to repaint the same charts without app.js involved.
   -------------------------------------------------------------------------- */

var progress = { ex:null, relative:false };

function compact(v){
  return v >= 10000 ? Math.round(v / 1000) + "k" : Math.round(v).toLocaleString();
}

/* The series behind the strength chart, plus how to write its numbers. */
function strengthView(){
  var names = store.loggedExercises();
  if(!names.length) return null;

  if(names.indexOf(progress.ex) < 0) progress.ex = names[0];

  var series = store.exerciseSeries(progress.ex);
  var relative = progress.relative && series.metric === "load";
  var shown = relative ? store.relativeSeries(series) : series;

  return {
    names: names,
    series: shown,
    metric: series.metric,
    relative: relative,
    canRelate: series.metric === "load" && store.state.body.length > 0,
    fmtV: relative
      ? function(v){ return v.toFixed(2) + "× bodyweight"; }
      : (series.metric === "load"
          ? function(v){ return Math.round(v).toLocaleString() + " " + unit(); }
          : function(v){ return Math.round(v) + " reps"; }),
    fmtY: relative
      ? function(v){ return v.toFixed(2); }
      : function(v){ return compact(v); }
  };
}

function statTile(label, value, sub){
  return '<div class="stat">' +
    '<span class="k">' + esc(label) + '</span>' +
    '<b>' + esc(value) + '</b>' +
    (sub ? '<small>' + esc(sub) + '</small>' : '') +
  '</div>';
}

/* Ten weeks of days, Sunday-first so the columns are weeks. Trained days
   carry three steps of one hue (more volume, darker); missed and rest are
   their own states and are named in the legend, never colour alone. */
function calendarHTML(){
  var cells = store.calendar(10);
  var names = { trained:"trained", missed:"missed", rest:"rest day", none:"nothing logged" };

  var head = ["S","M","T","W","T","F","S"].map(function(d){
    return '<span class="cal-h">' + d + '</span>';
  }).join("");

  var grid = cells.map(function(c){
    var label = formatWeekday(c.at) + " — " + names[c.state] +
      (c.entry && !store.isSkip(c.entry) ? " · " + c.entry.dayName : "");
    return '<i class="cal-c" data-state="' + c.state + '" data-level="' + c.level +
             '" title="' + esc(label) + '"></i>';
  }).join("");

  return '<div class="cal">' +
      '<div class="cal-head">' + head + '</div>' +
      '<div class="cal-grid">' + grid + '</div>' +
    '</div>' +
    '<div class="cal-key">' +
      '<span><i class="cal-c" data-state="trained" data-level="2"></i>Trained</span>' +
      '<span><i class="cal-c" data-state="rest" data-level="0"></i>Rest day</span>' +
      '<span><i class="cal-c" data-state="missed" data-level="0"></i>Missed</span>' +
    '</div>';
}

/* --------------------------------------------------------------------------
   Nutrition

   Over and under are a DIRECTION, never a verdict: over is the goal on a
   bulk and the thing to avoid on a cut, so the colours stay put whatever
   the phase and the words carry the meaning. Text is always ink; the colour
   lives on a swatch or a mark beside it.
   -------------------------------------------------------------------------- */

var FOOD_WINDOW = 14;         /* days on the over/under chart */
var FOOD_AVG = 7;             /* days behind the averages */

function kcal(n){ return Math.round(n).toLocaleString(); }

/* Grams keep a decimal only when there is one. */
function grams(n){ return (Math.round(n * 10) / 10).toLocaleString() + " g"; }

/* A real minus sign, not a hyphen — it lines up with the plus. */
function signed(n){
  if(n > 0) return "+" + kcal(n);
  if(n < 0) return "−" + kcal(-n);
  return "0";
}

function diffWords(d){
  if(d === null || d === undefined) return "";
  if(d === 0) return "right on target";
  return kcal(Math.abs(d)) + (d > 0 ? " over" : " under");
}

function dirOf(d){ return d > 0 ? "over" : d < 0 ? "under" : "on"; }

function swatch(d){
  return d === null || d === 0 ? "" : '<i class="sw" data-dir="' + dirOf(d) + '"></i>';
}

function phaseBadge(phase){
  return store.PHASES[phase]
    ? '<span class="phase">' + esc(store.PHASES[phase]) + '</span>'
    : "";
}

/* Today against the target, as a meter.

   One bar, split at the target. Everything up to the target is the under
   colour on a lighter track of the same hue; anything past it runs on in
   the over colour. The scale stretches to fit a day that went over, so going
   over reads as a bar that ran long rather than as a bar that's merely full. */
function meterHTML(eaten, target){
  var scale = Math.max(target, eaten) || 1;
  var toTarget = Math.min(eaten, target) / scale * 100;
  var mark = target / scale * 100;
  var past = eaten > target ? (eaten - target) / scale * 100 : 0;

  return '<div class="meter" role="img" aria-label="' +
      esc(kcal(eaten) + " of " + kcal(target) + " kilocalories") + '">' +
    '<i class="meter-in" style="width:' + toTarget.toFixed(2) + '%"></i>' +
    (past
      ? '<i class="meter-over" style="left:' + mark.toFixed(2) + '%;width:' + past.toFixed(2) + '%"></i>' +
        '<i class="meter-mark" style="left:' + mark.toFixed(2) + '%"></i>'
      : '') +
  '</div>';
}

function macro(label, v){
  return '<div class="macro">' +
    '<span class="lab">' + esc(label) + '</span>' +
    (v === null || v === undefined ? '<i>not logged</i>' : '<b>' + esc(grams(v)) + '</b>') +
  '</div>';
}

/* The card you use every day: what today looks like, and what you're aiming at. */
function nutritionCard(){
  var today = store.dayKey(Date.now());
  var food = store.nutritionOn(today);
  var goal = store.currentGoal();
  var eaten = food ? food.kcal : null;
  var top;

  if(eaten !== null && goal){
    var d = eaten - goal.kcal;
    top =
      '<div class="food-today">' +
        '<div class="food-num"><b>' + kcal(eaten) + '</b>' +
          '<span>of ' + kcal(goal.kcal) + ' kcal today</span></div>' +
        '<span class="food-diff">' + swatch(d) + esc(diffWords(d)) + '</span>' +
      '</div>' +
      meterHTML(eaten, goal.kcal);
  }else if(eaten !== null){
    top =
      '<div class="food-today">' +
        '<div class="food-num"><b>' + kcal(eaten) + '</b><span>kcal today</span></div>' +
      '</div>';
  }else{
    top = '<p class="hint food-none">Nothing logged today' +
      (goal ? ' — ' + kcal(goal.kcal) + ' kcal to work with.' : '.') + '</p>';
  }

  var goalRow = goal
    ? '<div class="food-goal">' +
        '<div class="k">' +
          '<span class="lab">Daily target</span>' +
          '<b>' + kcal(goal.kcal) + ' kcal</b>' + phaseBadge(goal.phase) +
          '<small>since ' + esc(formatDay(store.fromDayKey(goal.from))) + '</small>' +
        '</div>' +
        '<button class="edit" id="editGoal">Change</button>' +
      '</div>'
    : '<div class="food-goal">' +
        '<div class="k">' +
          '<span class="lab">Daily target</span>' +
          '<small>Set one and every day shows how far over or under it you were.</small>' +
        '</div>' +
        '<button class="edit" id="editGoal">Set target</button>' +
      '</div>';

  return '<section class="card">' +
    '<div class="card-head">' +
      '<h3>Nutrition</h3>' +
      '<button class="edit" id="logFood">' + (food ? "Edit today" : "Log food") + '</button>' +
    '</div>' +
    top +
    (food ? '<div class="food-macros">' + macro("Protein", food.protein) + macro("Fiber", food.fiber) + '</div>' : '') +
    goalRow +
  '</section>';
}

/* An average and how many days it's made of — "172 g" means something
   different over seven days than over two. `note` is an optional line above
   the day count, for the calorie tile's over/under. */
function avgTile(label, a, fmt, note){
  return '<div class="food-avg-tile">' +
    '<span class="lab">' + esc(label) + '</span>' +
    (a.days ? '<b>' + esc(fmt(a.value)) + '</b>' : '<b class="none">—</b>') +
    (note ? '<small>' + esc(note) + '</small>' : '') +
    '<small>' + esc(a.days ? a.days + " of " + FOOD_AVG + " days" : "not logged") + '</small>' +
  '</div>';
}

/* An average is an estimate, and "165.2 g" claims a precision it hasn't got. */
function wholeGrams(n){ return Math.round(n).toLocaleString() + " g"; }

/* How many recent days the list shows before "show all". The rest are one
   tap away, and any older day is reachable from the date field in the food
   sheet — the list is for glancing, not archaeology. */
var FOOD_LIST = 7;

/* The history: the chart for the shape, the averages for the gist, and the
   list of days — the exact numbers, and the way into editing a past day. */
function calorieCard(){
  var avg = store.nutritionAverages(FOOD_AVG);
  var keys = store.nutritionKeys().slice(0, FOOD_WINDOW);

  var kcalNote = avg.diff.days ? diffWords(Math.round(avg.diff.value)) : "";

  var rows = keys.map(function(key, n){
    var food = store.nutritionOn(key);
    var goal = store.goalOn(key);
    var d = (food.kcal !== null && goal) ? food.kcal - goal.kcal : null;
    var bits = [];
    if(food.protein !== null) bits.push("P " + grams(food.protein));
    if(food.fiber !== null) bits.push("F " + grams(food.fiber));

    return '<button class="food-row" data-food="' + esc(key) + '"' +
             (n >= FOOD_LIST ? ' data-more hidden' : '') + '>' +
      '<span class="d">' + esc(formatWeekday(store.fromDayKey(key))) + '</span>' +
      '<b>' + (food.kcal !== null ? kcal(food.kcal) : "—") + '</b>' +
      '<span class="diff">' + (d !== null ? swatch(d) + esc(signed(d)) : "") + '</span>' +
      '<small>' + esc(bits.join(" · ")) + '</small>' +
    '</button>';
  }).join("");

  return '<section class="card">' +
    '<h3>Calories vs target</h3>' +
    '<div class="chart-key">' +
      '<span><i class="sw" data-dir="over"></i>Over target</span>' +
      '<span><i class="sw" data-dir="under"></i>Under target</span>' +
    '</div>' +
    '<div class="chart-host" id="chFood"></div>' +
    '<span class="lab food-avg-head">Last ' + FOOD_AVG + ' days, averaged</span>' +
    '<div class="food-avg">' +
      avgTile("Calories", avg.kcal, function(v){ return kcal(v); }, kcalNote) +
      avgTile("Protein", avg.protein, wholeGrams) +
      avgTile("Fiber", avg.fiber, wholeGrams) +
    '</div>' +
    (rows
      ? '<div class="food-list"><span class="lab">Recent days — tap one to edit it</span>' + rows +
          (keys.length > FOOD_LIST
            ? '<button class="add-btn" id="foodMore">Show all ' + keys.length + ' days</button>'
            : '') +
        '</div>'
      : '') +
  '</section>';
}

/* --------------------------------------------------------------------------
   Weight: the 7-day average leads, the single reading is the footnote
   -------------------------------------------------------------------------- */

function weightFmt(n){ return (Math.round(n * 10) / 10).toFixed(1); }

function signedWeight(n){
  if(n > 0) return "+" + weightFmt(n);
  if(n < 0) return "−" + weightFmt(-n);
  return "0.0";
}

/* The tile. Three honest states: an average this week; no weigh-in this
   week, so the last reading with its date; nothing at all. */
function weightTile(){
  var t = store.weightTrend();

  if(t.now){
    var sub = t.change === null
      ? t.now.count + (t.now.count === 1 ? " weigh-in" : " weigh-ins") + " this week"
      : t.change === 0
        ? "level with last week"
        : signedWeight(t.change) + " vs last week";
    return statTile("Weight · 7-day avg", weightFmt(t.now.value) + " " + unit(), sub);
  }
  if(t.latest){
    return statTile("Bodyweight", weightFmt(t.latest.w) + " " + unit(),
                    "none this week · last " + formatDay(t.latest.at));
  }
  return statTile("Bodyweight", "—", "add a weigh-in");
}

/* --------------------------------------------------------------------------
   Maintenance

   The estimate, what it's made of, and what it means for the target you've
   set. Before there's enough to go on it says exactly what's missing rather
   than showing a number it can't stand behind.
   -------------------------------------------------------------------------- */

function rateWords(perWeek){
  if(Math.abs(perWeek) < 0.05) return "holding steady";
  return (perWeek < 0 ? "losing " : "gaining ") + Math.abs(perWeek).toFixed(1) +
         " " + unit() + " a week";
}

function maintenanceCard(){
  var t = store.tdee();
  var est = t.now;
  var head = '<div class="card-head"><h3>Maintenance</h3><span class="tag">estimated</span></div>';

  if(!est.ready){
    var need = [];
    if(est.need.kcalDays) need.push(est.need.kcalDays + " more day" + (est.need.kcalDays === 1 ? "" : "s") + " with calories logged");
    if(est.need.weighIns) need.push(est.need.weighIns + " more weigh-in" + (est.need.weighIns === 1 ? "" : "s"));
    if(est.need.span)     need.push("weigh-ins spread over " + est.need.span + " more day" + (est.need.span === 1 ? "" : "s"));

    return '<section class="card">' + head +
      '<div class="tdee"><div class="tdee-num"><b class="none">—</b><span>not enough to go on yet</span></div></div>' +
      '<p class="tdee-why">Worked out from your own intake and weight trend over three weeks. Still to go:</p>' +
      '<ul class="tdee-need">' + need.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join("") + '</ul>' +
      '<p class="hint">It looks at the ' + est.window + ' days through yesterday and needs at least ' +
        store.TDEE_NEEDS.kcalDays + ' of them with calories and ' + store.TDEE_NEEDS.weighIns +
        ' weigh-ins across ' + store.TDEE_NEEDS.span + '+ days. Until then an online calculator is the better guess.</p>' +
    '</section>';
  }

  var goal = store.currentGoal();
  var goalLine = "";
  if(goal){
    var gap = goal.kcal - est.tdee;
    var weekly = gap * 7 / store.energyPerUnit();
    goalLine = '<p class="tdee-goal">Your ' + kcal(goal.kcal) + ' target is ' +
      (gap === 0 ? 'right at maintenance' :
        '<b>' + kcal(Math.abs(gap)) + (gap < 0 ? ' below' : ' above') + '</b> it — roughly ' +
        rateWords(weekly) + ' if you hit it') + '.</p>';
  }

  return '<section class="card">' + head +
    '<div class="tdee">' +
      '<div class="tdee-num"><b>' + kcal(est.tdee) + '</b><span>kcal a day</span></div>' +
      '<span class="tdee-band">± ' + kcal(est.band) + '</span>' +
    '</div>' +
    '<p class="tdee-why">Averaging <b>' + kcal(est.intake) + ' kcal</b> while ' +
      '<b>' + esc(rateWords(est.perWeek)) + '</b>.' +
      (t.change !== null && Math.abs(t.change) >= 10
        ? ' ' + (t.change > 0 ? 'Up ' : 'Down ') + kcal(Math.abs(t.change)) + ' from a week ago.'
        : '') +
    '</p>' +
    goalLine +
    '<p class="hint">From ' + est.kcalDays + ' of the last ' + est.window + ' days of food and ' +
      est.weighIns + ' weigh-ins, through ' + esc(formatDay(store.fromDayKey(est.to))) + '. ' +
      'The ± is how far the scale wanders from its trend; it narrows the more you weigh in. ' +
      'A consistent miscount of your food cancels out — the answer comes back in your own counting.</p>' +
  '</section>';
}

function renderProgress(){
  var s = store.summary();
  var view = strengthView();

  var sub = s.since
    ? "Week " + s.weeks + " · training since " + formatDay(s.since)
    : "Nothing logged yet";

  var picker = view
    ? '<select id="exPick" aria-label="Which exercise to chart">' +
        view.names.map(function(n){

                 (n === progress.ex ? " selected" : "") + '>' + esc(n) + '</option>';
        }).join("") +
      '</select>'
    : "";

  var toggle = (view && view.canRelate)
    ? '<div class="seg">' +
        '<button data-rel="0" aria-pressed="' + (!view.relative) + '">Load</button>' +

    (view.relative
      ? "Estimated one-rep max divided by what you weighed that week. It rises only when you get stronger faster than you get heavier."
      : view.metric === "load"
        ? "Estimated one-rep max (Epley) from your best set that day" +
          (store.isBodyweight(progress.ex) ? ", with your bodyweight added in" : "") + "."
        : "This one has never been logged with a load, so it charts your best set's reps instead.");

  viewEl.innerHTML =

        '<p class="sub">' + esc(sub) + '</p>' +
      '</div>' +
    '</div>' +

    '<div class="prog-wrap">' +
      '<div class="stats">' +
        statTile("Sessions", String(s.sessions), s.weeks ? s.weeks + " weeks in" : "") +
        statTile("Last 30 days", String(s.last30), s.missed30 ? s.missed30 + " missed" : "none missed") +
        statTile("Total volume", compact(s.volume) + " " + unit(), "everything lifted") +
        weightTile() +
      '</div>' +

      /* Near the top on purpose: it's the one card on this tab you'll touch
         every day, not just read. Maintenance sits between today and the
         history because it's what the target should be set from. */
      nutritionCard() +
      maintenanceCard() +

      '<section class="card">' +
        '<div class="card-head">' +
          '<h3>Strength trend</h3>' + toggle +
        '</div>' +
        picker +
        '<div class="chart-host hero" id="chStrength"></div>' +
        (strengthNote ? '<p class="hint">' + esc(strengthNote) + '</p>' : '') +
      '</section>' +

      '<section class="card">' +
        '<div class="card-head">' +
          '<h3>Bodyweight</h3>' +
          '<button class="edit" id="logWeight">Log weight</button>' +
        '</div>' +
        '<div class="chart-key">' +
          '<span><i class="sw line"></i>7-day average</span>' +
          '<span><i class="sw raw"></i>Daily weigh-in</span>' +
        '</div>' +
        '<div class="chart-host" id="chBody"></div>' +
        (store.state.body.length > 1
          ? '<p class="hint">Water moves a single reading by a pound or three — ' +
              'the line is what’s actually changing.</p>'
          : '') +
      '</section>' +

      '<section class="card">' +
        '<h3>Volume per session</h3>' +
        '<div class="chart-host" id="chVolume"></div>' +
        '<p class="hint">Every rep of every set multiplied by the weight on it. ' +
          'It climbs as you add load, reps or sets.</p>' +

      '<section class="card">' +

        calendarHTML() +

  $("actionbar").hidden = true;

/* Charts are measured from their host, so they can only be drawn once the
   markup is in the document — and have to be redrawn when it resizes. */
function paintCharts(){
  if(!$("chStrength")) return;

  var view = strengthView();

  IL.chart.draw($("chStrength"), {
    kind: "line",
    points: view ? view.series.points : [],
    fmtY: view ? view.fmtY : compact,
    fmtV: view ? view.fmtV : compact,
    fmtX: formatDay,
    label: view ? view.series.name + " over time" : "strength trend",
    empty: "Log the same exercise on two different days and its trend line appears here."
  });

  /* The line is the 7-day average as of each weigh-in; the readings sit
     underneath as faint dots, so the noise is visible but can't steal the eye. */
  var body = store.bodyTrendSeries();
  IL.chart.draw($("chBody"), {
    kind: "line",
    points: body,
    raw: body.map(function(p){ return { x:p.x, y:p.raw }; }),
    fmtY: function(v){ return Math.round(v); },
    fmtV: function(v, p){
      return weightFmt(v) + " " + unit() + " avg · weighed " + weightFmt(p.raw);
    },
    fmtX: formatDay,
    label: "bodyweight, seven-day average over time",
    empty: "Two weigh-ins draw a line. Log the first one with the button above."
  });

  IL.chart.draw($("chVolume"), {
    kind: "column",
    points: store.volumeSeries().slice(-18),
    fmtY: compact,
    fmtV: function(v){ return Math.round(v).toLocaleString() + " " + unit(); },
    fmtX: formatDay,
    label: "volume per session",
    empty: "Finish a session and its volume lands here."
  });

  /* Every one of the last fortnight's days gets a slot, logged or not, so a
     gap in the chart is a gap in the diary. Each bar is measured against the
     target in force that day, which is why a phase change moves the zero
     line's meaning but never redraws the past. */
  IL.chart.draw($("chFood"), {
    kind: "diverging",
    points: store.nutritionSeries(FOOD_WINDOW).map(function(r){
      return { x:r.at, y:r.diff, row:r };
    }),
    fmtY: signed,
    fmtV: function(v, p){
      var r = p.row;
      if(r.kcal === null) return "Not logged";
      if(r.target === null) return kcal(r.kcal) + " kcal · no target";
      return diffWords(v) + " · " + kcal(r.kcal) + " of " + kcal(r.target);
    },
    fmtX: formatDay,
    label: "calories over or under target, last " + FOOD_WINDOW + " days",
    empty: store.currentGoal() || store.state.nutrition.goals.length
      ? "Log a day's calories and it shows up here against your target."
      : "Set a daily target and every day you log shows up here as over or under it."
  });
}

/* --------------------------------------------------------------------------
   Bottom sheet
   -------------------------------------------------------------------------- */

function openSheet(title, html, mode){
  $("sheetTitle").textContent = title;
  $("sheetBody").innerHTML = html;
  sheetEl.dataset.mode = mode;
  sheetEl.hidden = false;
  scrimEl.hidden = false;
  requestAnimationFrame(function(){
    sheetEl.classList.add("open");
    scrimEl.classList.add("open");
  });
}

function closeSheet(){
  sheetEl.classList.remove("open");
  scrimEl.classList.remove("open");
  setTimeout(function(){
    sheetEl.hidden = true;
    scrimEl.hidden = true;
  }, 220);
}

function sheetMode(){ return sheetEl.dataset.mode; }

/* --------------------------------------------------------------------------
   Set logger — one set, one or more weights
   -------------------------------------------------------------------------- */

/* An empty box, not a zero. A pre-filled 0 has to be selected and deleted
   before you can type, which is three actions for what should be one — so
   zero shows as the placeholder and the field starts blank. */
function stepper(kind, index, value, step, min){
  return '<div class="stepper mini">' +
    '<button data-seg="' + kind + ',' + index + ',' + (-step) + '" aria-label="Less">−</button>' +
    '<input type="number" inputmode="' + (kind === "w" ? "decimal" : "numeric") + '"' +
      ' step="any" min="' + min + '" data-segval="' + kind + ',' + index + '"' +
      ' placeholder="0" value="' + (value || "") + '">' +
    '<button data-seg="' + kind + ',' + index + ',' + step + '" aria-label="More">+</button>' +
  '</div>';
}

function segmentBlock(seg, index, isDrop, repChips){
  return '<div class="segblock' + (isDrop ? " is-drop" : "") + '">' +
    '<div class="segblock-head">' +
      '<span class="seglabel">' + (isDrop ? "Drop " + index : "Top set") + '</span>' +
      (isDrop ? '<button class="segdel" data-segdel="' + index + '">Remove</button>' : '') +
    '</div>' +
    '<div class="seggrid">' +
      '<div class="field">' +
        '<span class="lab">Weight (' + esc(unit()) + ')</span>' +
        stepper("w", index, seg.w, store.state.prefs.step, 0) +
      '</div>' +
      '<div class="field">' +
        '<span class="lab">Reps</span>' +
        stepper("r", index, seg.r, 1, 0) +
      '</div>' +
    '</div>' +
    (repChips || "") +
  '</div>';
}

function setTotalHTML(segs){
  return '<span>' + segs.length + (segs.length === 1 ? " weight" : " weights") + '</span>' +
    '<b>' + store.totalReps(segs) + ' reps · ' +
      Math.round(store.segmentVolume(segs)).toLocaleString() + ' ' + esc(unit()) + '</b>';
}

/* Update just the running total, so typing in a field isn't interrupted. */
function refreshSetTotal(row, k){
  var el = $("setTotal");
  if(!el) return;
  var segs = store.currentDay().ex[row].log[k];
  if(segs) el.innerHTML = setTotalHTML(segs);
}

function setSheet(row, k){
  var e = store.currentDay().ex[row];
  var segs = e.log[k] || store.quickLog(e, k);

  var chips = store.repChoices(e.reps);
  var chipHTML = chips.length
    ? '<div class="quick reps">' + chips.map(function(n){
        return '<button data-repquick="' + n + '"' +
               (segs[0].r === n ? ' aria-pressed="true"' : '') + '>' + n + '</button>';
      }).join("") + '</div>'
    : "";

  var blocks = segs.map(function(seg, i){
    return segmentBlock(seg, i, i > 0, i === 0 ? chipHTML : "");
  }).join("");

  openSheet("Set " + (k + 1),
    '<p class="sheet-sub">' + esc(e.name) + ' · target ' + esc(e.reps) + '</p>' +
    blocks +
    '<button class="add-btn" id="addDrop">+ Add a drop</button>' +
    '<div class="settotal" id="setTotal">' + setTotalHTML(segs) + '</div>' +
    '<div class="rowbtns one">' +
      '<button class="danger" id="clearSet">Clear this set</button>' +
    '</div>',
  "set");
}
